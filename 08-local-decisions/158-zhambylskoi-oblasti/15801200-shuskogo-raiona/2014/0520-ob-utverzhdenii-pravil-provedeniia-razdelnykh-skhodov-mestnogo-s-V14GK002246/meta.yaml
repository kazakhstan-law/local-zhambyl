  title:
    rus: О признании утратившим силу решения Шуского районного маслихата от 20 мая 2014 года № 28-11 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Шуском районе»
    kaz: «Шу ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы» Шу аудандық мәслихатының 2014 жылғы 20 мамырдағы № 28-11 шешімінің  күші жойылды деп тану туралы
