act_code: '80766'
requisite: Решение Шуского районного маслихата Жамбылской области от 20 мая 2014 года № 28-11. Зарегистрировано Департаментом юстиции Жамбылской области 20 июня 2014 года № 2246. Утратило силу решением Шуского районного маслихата Жамбылской области от 5 марта 2024 года № 17-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, улицы, многоквартирного жилого домадля участия в сходе местного сообщества в Шуском районе
  kaz: Шу ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын  және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы
