act_code: '207400'
requisite: Решение Шуского районного маслихата Жамбылской области от 24 февраля 2025 года № 35-5
title:
  rus: «О предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сельских округов, прибывшим для работы и проживания в сельские населенные пункты Шуского района на 2025 год»
  kaz: «Шу ауданының ауылдық елдi мекендеріне жұмыс iстеу және тұру үшін келген ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне, денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2025 жылға арналған әлеуметтік қолдау шараларын ұсыну мөлшерін айқындау туралы»
