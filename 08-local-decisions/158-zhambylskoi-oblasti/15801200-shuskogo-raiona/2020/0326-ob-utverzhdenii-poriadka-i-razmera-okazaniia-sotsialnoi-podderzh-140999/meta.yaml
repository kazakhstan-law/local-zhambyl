act_code: '140999'
requisite: Решение Шуского районного маслихата Жамбылской области от 26 марта 2020 года № 59-4. Зарегистрировано Департаментом юстиции Жамбылской области 2 апреля 2020 года № 4538. Утратило силу решением Шуского районного маслихата Жамбылской области от 28 декабря 2021 года № 19-5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Шуского района
  kaz: Шу ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібі және мөлшері туралы
