requisite: Жамбыл облысы Шу ауданы әкімінің 2009 жылғы 14 желтоқсандағы № 9 шешімі. Жамбыл облысы Шу ауданының Әділет басқармасында 2010 жылғы 22 қаңтарда 6-11-85 нөмірімен тіркелді. Күші жойылды - Жамбыл облысы Шу ауданы әкімінің 2015 жылғы 10 қыркүйекте № 4 шешімімен
