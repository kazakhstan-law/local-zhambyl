  title:
    rus: О внесении изменения в решение Шуского районного маслихата от 21 октября 2016 года № 5-3 «Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Шуском районе»
    kaz: «Шу ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы» Шу аудандық мәслихатының 2016 жылғы 21 қазандағы № 5-3 шешіміне өзгеріс енгізу туралы
