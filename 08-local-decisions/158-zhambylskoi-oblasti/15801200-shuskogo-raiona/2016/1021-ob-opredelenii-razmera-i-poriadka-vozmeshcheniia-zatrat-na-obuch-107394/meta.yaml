act_code: '107394'
requisite: Решение Шуского районного маслихата Жамбылской области 21 октября 2016 года № 5-3. Зарегистрировано Департаментом юстиции Жамбылской области 4 ноября 2016 года № 3206. Утратило силу решением Шуского районного маслихата Жамбылской области от 18 апреля 2022 года № 26-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Шуском районе
  kaz: Шу ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
