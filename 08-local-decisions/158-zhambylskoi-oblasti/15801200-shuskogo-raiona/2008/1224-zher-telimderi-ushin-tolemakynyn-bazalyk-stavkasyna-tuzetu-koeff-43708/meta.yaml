requisite: Жамбыл облысы Шу ауданы мәслихатының 2008 жылғы 24 желтоқсандағы № 12-5 шешімі. Жамбыл облысы Шу ауданының Әділет басқармасында 2009 жылғы 26 қаңтарда 6-11-68 нөмірімен тіркелді. Күші жойылды - Жамбыл облысы Шу аудандық мәслихатының 2015 жылғы 20 тамыздағы № 43-5 шешімімен
