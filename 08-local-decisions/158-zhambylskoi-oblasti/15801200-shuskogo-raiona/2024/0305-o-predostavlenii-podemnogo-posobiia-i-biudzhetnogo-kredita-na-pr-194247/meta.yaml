act_code: '194247'
requisite: Решение Шуского районного маслихата Жамбылской области от 5 марта 2024 года № 17-13
title:
  rus: О предоставлении подъемного пособия и бюджетного кредита на приобретение или строительство жилья специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Шуского района на 2024 год
  kaz: 2024 жылы Шу ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне тұрғын үй сатып алуға немесе салуға бюджеттік кредит беру және бір жолғы көтерме жәрдемақы беру туралы
