act_code: '166816'
requisite: Решение Шуского районного маслихата Жамбылской области от 18 апреля 2022 года № 26-3. Зарегистрировано в Министерстве юстиции Республики Казахстан 20 апреля 2022 года № 27664. Утратило силу решением Шуского районного маслихата Жамбылской области от 26 июня 2023 года № 4-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Шуском районе
  kaz: Шу ауданында мүгедектер қатарындағы кемтар балаларды жеке жоспары бойынша үйде оқытуға жұмсалған шығындарын өндіріп алу тәртібі мен мөлшерін айқындау туралы
