act_code: '165106'
requisite: Решение Шуского районного маслихата Жамбылской области от 21 февраля 2022 года № 23-3. Отменен решением Шуского районного маслихата Жамбылской области от 16 января 2023 года № 40-4(вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Шуского района на 2022 год
  kaz: 2022 жылы Шу ауданы ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтiк қолдау көрсету туралы
