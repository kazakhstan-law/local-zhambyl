requisite: Жамбыл облысы Шу аудандық мәслихатының 2010 жылғы 12 тамыздағы № 25-6 шешімі. Жамбыл облысы Шу ауданының Әділет басқармасында 2010 жылғы 15 қыркүйекте 6-11-96 нөмірімен тіркелді. Күші жойылды - Жамбыл облысы Шу аудандық мәслихатының 2015 жылғы 20 тамыздағы № 43-5 шешімімен
