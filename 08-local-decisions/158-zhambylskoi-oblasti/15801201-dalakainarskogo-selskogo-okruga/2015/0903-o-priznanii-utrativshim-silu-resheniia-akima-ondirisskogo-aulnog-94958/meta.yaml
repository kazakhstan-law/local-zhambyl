title:
  rus: О признании утратившим силу решения акима Ондирисского аульного округа от 19.02.2014 года № 2 "Об установлении ветеринарного режима карантинной зоны с введением карантинного режима на территории населенного пункта "Штаб" Ондирисского аульного округа"
