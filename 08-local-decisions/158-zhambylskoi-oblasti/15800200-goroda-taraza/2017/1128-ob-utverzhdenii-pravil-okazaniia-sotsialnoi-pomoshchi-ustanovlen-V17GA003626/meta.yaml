  requisite: Решение Таразского городского маслихата Жамбылской области от 28 апреля 2020 года № 57-6. Зарегистрировано Департаментом юстиции Жамбылской области 4 мая 2020 года № 4605. Утратило силу решением Таразского городского маслихата Жамбылской области от 23 декабря 2020 года № 66-8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
  title:
    rus: О внесении изменений и дополнений в решение Таразского городского маслихата от 28 ноября 2017 года № 25-4 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по городу Тараз»
    kaz: «Тараз қаласы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» Тараз қалалық мәслихатының 2017 жылғы 28 қарашадағы № 25-4 шешіміне өзгерістер мен толықтырулар енгізу туралы
