  title:
    rus: О внесении изменений и дополнений в решешие Таразского городского маслихата от 28 ноября 2017 года №25-4 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по городу Тараз»
    kaz: «Тараз қаласы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» Тараз қалалық мәслихатының 2017 жылғы 28 қарашадағы №25-4 шешіміне өзгерістер мен толықтырулар енгізу туралы
