title:
  rus: Об определение размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностям из числа инвалидов индивидуальному учебному плану по городу Тараз
  kaz: Тараз қаласында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
