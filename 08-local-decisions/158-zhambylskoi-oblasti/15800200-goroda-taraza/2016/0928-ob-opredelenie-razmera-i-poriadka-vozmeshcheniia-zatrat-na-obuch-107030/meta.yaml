  title:
    rus: О внесении изменения в решение Таразского городского маслихата от 28 сентября 2016 года № 9-5 «Об определение размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов индивидуальному учебному плану по городу Тараз
    kaz: Тараз қалалық мәслихатының «Тараз қаласында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы» 2016 жылғы 28 қыркүйектегі № 9-5 шешіміне өзгеріс енгізу туралы
