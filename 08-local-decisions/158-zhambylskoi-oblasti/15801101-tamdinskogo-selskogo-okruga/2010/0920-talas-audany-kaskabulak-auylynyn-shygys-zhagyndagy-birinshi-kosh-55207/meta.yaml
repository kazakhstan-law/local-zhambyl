act_code: '55207'
requisite: Жамбыл облысы Талас ауданы Қасқабұлақ ауылдық округі әкімінің 2010 жылғы 20 қыркүйектегі № 4 шешімі. Жамбыл облысы Талас ауданының Әділет басқармасында 2010 жылғы 29 қазанда нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 6-10-107 болып енгізілді
