act_code: '43599'
requisite: Жамбыл облысы Мойынқұм аудандық мәслихатының 2008 жылғы 29 желтоқсандағы № 15-3 шешімі. Жамбыл облысы Мойынқұм ауданының Әділет басқармасында 2009 жылғы 19 қаңтарда № 6-7-43 тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Жамбыл облыстық Әділет департаментінің 2013 жылғы 11 наурыздағы № 2-2-17/388 хаты)
