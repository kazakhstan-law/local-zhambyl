act_code: '222463'
requisite: Решение Мойынкумского районного маслихата Жамбылской области от 19 февраля 2026 года № 51-3
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения,образования, социального обеспечения,культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы ипроживания в сельские населенные пункты Мойынкумского района в 2026 году
  kaz: 2026 жылы Мойынқұм ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
