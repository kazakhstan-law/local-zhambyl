  title:
    rus: О внесении изменений в решение Мойынкумского районного маслихата  от 4 мая 2015 года №34-2 "Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по Мойынкумскому району"
    kaz: '"Мойынқұм ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы" Мойынқұм аудандық мәслихатының 2015 жылғы 4 мамырдағы  № 34-2 шешіміне  өзгерістер енгізу туралы'
