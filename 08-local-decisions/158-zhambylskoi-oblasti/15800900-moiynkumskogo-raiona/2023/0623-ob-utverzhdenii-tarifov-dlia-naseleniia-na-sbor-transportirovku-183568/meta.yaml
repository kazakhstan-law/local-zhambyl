requisite: Решение Мойынкумского районного маслихата Жамбылской области от 23 июня 2023 года № 4-10. Зарегистрировано Департаментом юстиции Жамбылской области 1 июля 2023 года № 5053
title:
  rus: Об утверждении тарифов для населения на сбор, транспортировку, сортировку и захоронение твердых бытовых отходов по Мойынкумскому району Жамбылской области
  kaz: Жамбыл облысы Мойынқұм ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын және халық үшін тұрмыстық қатты қалдықтарды жинауға, тасымалдауға,  сұрыптауға және көмуге арналған тарифі бекіту туралы
