act_code: '155235'
requisite: Решение Мойынкумского районного маслихата Жамбылской области от 20 апреля 2021 года № 3-6. Зарегистрировано Департаментом юстиции Жамбылской области 26 апреля 2021 года № 4953
title:
  rus: О предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельского округа, прибывшим для работы и проживания в сельские населенные пункты Мойынкумского района в 2021 году
  kaz: 2021 жылы Мойынқұм ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округ әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы
