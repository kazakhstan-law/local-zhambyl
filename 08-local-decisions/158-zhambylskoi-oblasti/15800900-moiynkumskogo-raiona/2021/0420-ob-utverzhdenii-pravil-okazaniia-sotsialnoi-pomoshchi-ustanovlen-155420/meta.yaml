  title:
    rus: О внесении изменения в решение Мойынкумского районного маслихата от 20 апреля 2021 года № 3-16 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по Мойынкумскому району»
    kaz: «Мойынқұм аудандық мәслихатының 2021 жылғы 20 сәуірдегі №3-16 Мойынқұм ауданында әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
