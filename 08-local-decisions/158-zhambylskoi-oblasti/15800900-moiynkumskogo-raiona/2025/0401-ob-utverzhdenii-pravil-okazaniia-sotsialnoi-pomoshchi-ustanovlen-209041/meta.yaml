requisite: Решение Мойынкумского районного маслихата Жамбылской области от 1 апреля 2025 года № 36-13. Зарегистрировано Департаментом юстиции Жамбылской области от 8 апреля 2025 года № 5269-08. Утратило силу решением Мойынкумского районного маслихата Жамбылской области от 17 августа 2026 года № 59-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования).
title:
  rus: Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан по Мойынкумскому району
  kaz: Мойынқұм ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы
