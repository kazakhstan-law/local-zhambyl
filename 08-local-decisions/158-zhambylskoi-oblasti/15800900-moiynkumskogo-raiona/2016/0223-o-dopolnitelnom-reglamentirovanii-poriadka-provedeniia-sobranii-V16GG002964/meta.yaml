title:
  rus: О дополнительном регламентировании порядка проведения собраний, митингов, шествий, пикетов и демонстраций по Мойынкумскому району
  kaz: Мойынқұм ауданы бойынша жиналыстар, митингiлер, шерулер, пикеттер мен демонстрациялар өткізу тәртібін қосымша реттеу туралы
