act_code: '107606'
requisite: Решение Мойынкумского районного маслихата Жамбылской области от 31 октября 2016 года № 5-4. Зарегистрировано Департаментом юстиции Жамбылской области 16 ноября 2016 года № 3212. Утратило силу решением Мойынкумского районного маслихата Жамбылской области от 28 августа 2020 года № 64-5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Мойынкумском районе
  kaz: Мойынқұм ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
