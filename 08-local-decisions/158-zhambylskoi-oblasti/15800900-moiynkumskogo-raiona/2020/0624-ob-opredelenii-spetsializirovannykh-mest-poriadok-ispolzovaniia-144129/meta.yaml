requisite: Решение Мойынкумского районного маслихата Жамбылской области от 24 июня 2020 года № 60-3. Зарегистрировано Департаментом юстиции Жамбылской области 25 июня 2020 года № 4640
title:
  rus: Об определении специализированных мест, порядок использования специальных мест, нормы их предельного наполнения, а также требования к материально-техническому и организационному обеспечению для организации и проведения мирных собраний в Мойынкумском районе
  kaz: Мойынқұм ауданында бейбіт жиналыстарды ұйымдастыру және өткізуге арналған арнайы орындар, арнайы орындарды пайдалану тәртібі, олардың шекті толу нормалары, сондай-ақ материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптар айқындау туралы
