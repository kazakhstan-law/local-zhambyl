  title:
    rus: О внесении изменений в решение Мойынкумского районного маслихата от 28 августа 2020 года № 64-5 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа детей с инвалидностью по индивидуальному учебному плану в Мойынкумском районе»
    kaz: «Мойынқұм ауданында мүгедектігі бар балалар қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы» Мойынқұм аудандық мәслихатының 2020 жылғы 28 тамыздағы № 64-5 шешіміне өзгерістер енгізу туралы
