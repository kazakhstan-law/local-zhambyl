  title:
    rus: О внесении изменений в решение маслихата Мойынкумского района Жамбылской области от 24 июня 2020 года № 60-3 «Об определении специализированных мест, порядок использования специальных мест, нормы их предельного наполнения, а также требования к материально-техническому и организационному обеспечению для организации и проведения мирных собраний в Мойынкумском районе»
    kaz: «Мойынқұм ауданында бейбіт жиналыстарды ұйымдастыру және өткізуге арналған арнайы орындар, арнайы орындарды пайдалану тәртібі, олардың шекті толу нормалары, сондай-ақ материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптар айқындау туралы» Мойынқұм аудандық мәслихатының 2020 жылғы 24 маусымдағы №60-3 шешіміне өзгеріс енгізу туралы
