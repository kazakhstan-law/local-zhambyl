act_code: '107356'
requisite: Решение Меркенского районного маслихата Жамбылской области от 25 октября 2016 года № 9-4. Зарегистрировано Департаментом юстиции Жамбылской области 4 ноября 2016 года № 3208. Утратило силу решением Меркенского районного маслихата Жамбылской области от 24 июля 2023 года № 5-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Меркенском районе
  kaz: Меркі ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
