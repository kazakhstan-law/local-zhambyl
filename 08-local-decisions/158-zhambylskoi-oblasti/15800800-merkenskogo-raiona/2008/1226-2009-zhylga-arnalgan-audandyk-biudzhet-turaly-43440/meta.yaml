requisite: Жамбыл облысы Меркі аудандық мәслихатының 2008 жылғы 26 желтоқсандағы № 17-5 шешімі. Жамбыл облысы Меркі ауданының Әділет басқармасында 2009 жылғы 9 қаңтарда 6-6-62 нөмірімен тіркелді. Шешімінің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Меркі аудандық Әділет басқармасының 2010 жылғы 27 мамырдағы № 4-1151 хатымен
