requisite: Жамбыл облысы Меркі аудандық мәслихатының 2008 жылғы 26 наурыздағы № 7-19 шешімі. Жамбыл облысы Меркі ауданының Әділет басқармасында 2010 жылғы 28 сәуірде 6-6-54 нөмірімен тіркелді. Күші жойылды - Жамбыл облысы Меркі ауданы мәслихатының 2013 жылғы 22 тамыздағы № 18-7 шешімімен
