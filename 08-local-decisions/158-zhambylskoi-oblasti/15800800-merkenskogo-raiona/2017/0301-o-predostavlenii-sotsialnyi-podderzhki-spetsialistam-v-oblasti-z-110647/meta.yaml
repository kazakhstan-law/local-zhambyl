requisite: Решение Меркенского районного маслихата Жамбылской области от 1 марта 2017 года № 14-5. Зарегистрировано Департаментом юстиции Жамбылской области 24 марта 2017 года № 3361
title:
  rus: О предоставлении социальный поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Меркенского района в 2017 году
  kaz: 2017 жылы Меркі ауданының ауыдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына әлеуметтік қолдау көрсету туралы
