act_code: '81741'
requisite: Решение маслихата Меркенского района Жамбылской области от 24 июня 2014 года № 30-7. Зарегистрировано Департаментом юстиции Жамбылской области 4 августа 2014 года № 2286. Утратило силу решением Меркенского районного маслихата Жамбылской области от 11 марта 2024 года № 20-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правила проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Меркенском районе
  kaz: Меркі ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы
