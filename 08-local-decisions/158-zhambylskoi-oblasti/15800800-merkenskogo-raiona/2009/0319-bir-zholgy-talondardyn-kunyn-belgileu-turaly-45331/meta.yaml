requisite: Жамбыл облысы Меркі аудандық мәслихатының 2009 жылғы 19 наурыздағы № 20-5 шешімі. Жамбыл облысы Меркі ауданының Әділет басқармасында 2009 жылғы 21 сәуірде 6-6-64 нөмірімен тіркелді. Шешімінің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Меркі аудандық Әділет басқармасының 2010 жылғы 27 мамырдағы № 4-1151 хатымен
