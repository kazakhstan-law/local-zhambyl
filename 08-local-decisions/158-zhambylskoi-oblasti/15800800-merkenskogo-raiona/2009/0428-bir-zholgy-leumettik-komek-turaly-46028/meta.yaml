requisite: Жамбыл облысы Меркі аудандық мәслихатының 2009 жылғы 28 сәуірдегі № 21-8 шешімі. Жамбыл облысы Меркі ауданының Әділет басқармасында 2009 жылғы 22 мамырда 6-6-67 нөмірімен тіркелді. Шешімінің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Меркі аудандық Әділет басқармасының 2010 жылғы 27 мамырдағы № 4-1151 хатымен
