act_code: '133401'
requisite: Решение Меркенского районного маслихата Жамбылской области от 19 июля 2019 года № 49-4. Зарегистрировано Департаментом юстиции Жамбылской области 23 июля 2019 года № 4284. Утратило силу решением Меркенского районного маслихата Жамбылской области от 28 июля 2023 года № 6-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования, накопления коммунальных отходов и тарифов на сбор, утилизацию, вывоз и захоронение твердых бытовых отходов по Меркенскому району
  kaz: Меркі ауданы бойынша коммуналдық қалдықтардың түзілу, жинақталу нормаларын және тұрмыстық қатты қалдықтарды жинауға, кәдеге жаратуға, әкетуге және көмуге арналған тарифтерді бекіту туралы
