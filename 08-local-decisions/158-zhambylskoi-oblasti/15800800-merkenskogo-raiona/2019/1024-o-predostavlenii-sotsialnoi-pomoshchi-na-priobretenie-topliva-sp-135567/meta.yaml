requisite: Решение Меркенского районного маслихата Жамбылской области от 24 октября 2019 года № 56-3. Зарегистрировано Департаментом юстиции Жамбылской области 28 октября 2019 года № 4369. Утратило силу решением Меркенского районного маслихата Жамбылской области от 18 октября 2021 года № 14-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам социального обеспечения, образования, культуры, спорта, ветеринарии, здравоохранения  работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет спорт, ветеринария, денсаулық сақтау ұйымдарының мамандарына отын сатып алу үшін көмек беру туралы
