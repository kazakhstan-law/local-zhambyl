title:
  rus: Об утратившим силу решение маслихата Меркенского района Жамбылской области от 13 апреля 2018 года №27-6 «Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата Меркенского районного маслихата»
