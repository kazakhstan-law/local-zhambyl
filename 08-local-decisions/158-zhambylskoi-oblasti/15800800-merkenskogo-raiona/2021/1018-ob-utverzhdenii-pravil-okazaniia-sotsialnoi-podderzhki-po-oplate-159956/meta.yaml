act_code: '159956'
requisite: Решение Меркенского районного маслихата Жамбылской области от 18 октября 2021 года № 14-3. Зарегистрировано в Министерстве юстиции Республики Казахстан 30 октября 2021 года № 24973
title:
  rus: Об утверждении Правил оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Меркенского района
  kaz: Меркі ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету қағидасын бекіту туралы
