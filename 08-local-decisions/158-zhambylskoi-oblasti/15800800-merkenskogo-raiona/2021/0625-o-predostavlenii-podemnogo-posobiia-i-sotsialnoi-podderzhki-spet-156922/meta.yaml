  title:
    rus: О внесений дополнений в решение маслихата №9-3 от 25 июня 2021 года Меркенского района «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселка, сельских округов прибывшим для работы и проживания в сельские населенные пункты Меркенского района на 2021 году»
    kaz: Меркі аудандық 2021 жылғы 25 маусымдағы №9-3 «2021 жылға Меркі ауданының ауылдық елдi мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кент, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы» шешіміне толықтырулар енгізу туралы
  link: https://zan.gov.kz/client/#!/doc/157240/rus
