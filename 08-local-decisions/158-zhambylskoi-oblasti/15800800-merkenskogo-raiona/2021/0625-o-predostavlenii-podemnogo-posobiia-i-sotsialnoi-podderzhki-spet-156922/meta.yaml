act_code: '156922'
requisite: Решение Меркенского районного маслихата Жамбылской области от 25 июня 2021 года № 9-3. Зарегистрировано в Министерстве юстиции Республики Казахстан 13 июля 2021 года № 23472
title:
  rus: О предоставлении подьемного пособия и социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселка, сельских округов прибывшим для работы и проживания в сельские населенные пункты Меркенского района на 2021 году
  kaz: 2021 жылға Меркі ауданының ауылдық елдi мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кент, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне көтерме жәрдемақы және әлеуметтік қолдау ұсыну туралы
