requisite: Жамбыл облысы Меркі аудандық мәслихатының 2004 жылға 13 ақпандағы № 5-19 шешімі. Жамбыл облыстық Әділет Департаментінде 2004 жылғы 25 наурызда № 1277 тіркелді. Күші жойылды - Жамбыл облысы Меркі ауданы мәслихатының 2013 жылғы 22 тамыздағы № 18-7 шешімімен
