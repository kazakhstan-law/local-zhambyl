act_code: '222343'
requisite: Решение Меркенского районного маслихата Жамбылской области от 19 февраля 2026 года № 55-5
title:
  rus: «Об утверждении размеров предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков,сельских округов, прибывшим для работы и проживания в сельские населенные пункты  Меркенского района в 2026 году»
  kaz: «Меркі ауданының ауылдық елдi мекендерге 2026 жылы жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтiк қолдау шараларын ұсыну мөлшерін бекіту туралы»
