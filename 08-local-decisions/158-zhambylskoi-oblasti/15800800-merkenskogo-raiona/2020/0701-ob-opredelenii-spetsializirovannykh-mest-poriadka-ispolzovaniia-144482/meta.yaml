  title:
    rus: О внесении изменения в решение Меркенского района маслихата от 25 июня 2020 года № 68-3 «Об определении специализированных мест для проведения собраний, митингов, демонстраций, шествий, пикетирований и правил их использования в Меркенском районе»
    kaz: «Меркі ауданында бейбіт жиналыстарды ұйымдастыру және өткізуге арналған арнайы орындар, арнайы орындарды пайдалану тәртібі, олардың шекті толу нормалары, сондай-ақ материалдық-техникалық және ұйымдастырушылықты қамтамасыз етуге қойылатын талаптарды белгілеу туралы» Меркі аудандық мәслихатының 2020 жылғы 25 маусымдағы №68-3 шешiмiне өзгеріс енгізу енгізу туралы
