title:
  rus: Об определении специализированных мест, порядка использования специализированных мест, норм их предельного наполнения, а также требований к материально-техническому и организационному обеспечению для организации и проведения мирных собраний в Меркенском  районе
  kaz: Меркі ауданында бейбіт жиналыстарды ұйымдастыру және өткізуге арналған арнайы орындар, арнайы орындарды пайдалану тәртібі, олардың шекті толу нормалары, сондай-ақ материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды айқындау туралы
