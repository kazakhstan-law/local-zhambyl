act_code: '210709'
requisite: Решение маслихата Меркенского района Жамбылской области от 14 мая 2025 года № 42-8
title:
  rus: Об утверждении размеров  предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса,  государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты  Меркенского района в 2025 году
  kaz: Меркі ауданының ауылдық елдi мекендерге 2025 жылы жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтiк қолдау шараларын ұсыну мөлшерін бекіту туралы
