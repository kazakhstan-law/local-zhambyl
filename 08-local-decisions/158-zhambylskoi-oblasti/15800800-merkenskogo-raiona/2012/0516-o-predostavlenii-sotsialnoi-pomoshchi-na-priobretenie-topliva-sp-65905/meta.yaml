requisite: Решение маслихата Меркенского района Жамбылской области от 16 мая 2012 года № 5-6. Зарегистрировано Меркенским управлением юстиции 07 июня 2012 года за № 6-6-111. Утратило силу решением маслихата Меркенского района Жамбылской области от 20.05.2016 № 3-5
title:
