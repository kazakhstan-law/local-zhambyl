requisite: Решение Сарысуского районного маслихата Жамбылской области от 27 марта 2012 года № 3-7. Зарегистрировано Управлением юстиции Сарысуского района Жамбылской области 18 апреля 2012 года за № 6-9-136. Утратило силу решением Сарысуского районного маслихата Жамбылской области от 10 апреля 2013 года № 14-4
title:
