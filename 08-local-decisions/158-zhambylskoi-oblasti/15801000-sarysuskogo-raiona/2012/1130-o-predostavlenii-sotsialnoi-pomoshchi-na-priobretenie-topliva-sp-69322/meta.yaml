requisite: Решение Сарысуского районного маслихата Жамбылской области от 30 ноября 2012 года № 10-4. Зарегистрировано Департаментом юстиции Жамбылской области от 25 декабря 2012 года № 1862. Утратило силу решением Сарысуского районного маслихата Жамбылской области от 29 октября 2014 года № 36-4
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елдi мекендерде тұратын және жұмыс iстейтiн мемлекеттiк денсаулық сақтау, әлеуметтiк қамсыздандыру, бiлiм беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшiн әлеуметтiк көмек беру туралы
