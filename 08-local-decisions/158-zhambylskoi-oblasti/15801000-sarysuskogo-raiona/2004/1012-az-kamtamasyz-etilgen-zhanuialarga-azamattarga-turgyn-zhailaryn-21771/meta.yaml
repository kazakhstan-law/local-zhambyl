act_code: '21771'
requisite: Жамбыл облысы Сарысу аудандық мәслихатының 2004 жылғы 13 қазандағы № 8-4 шешімі. Жамбыл облыстық Әділет департаментінде 2004 жылғы 5 қарашада 1489 нөмірімен тіркелді. Күші жойылды - Жамбыл облысы Сарысу аудандық мәслихатының 2008 жылғы 3 маусымдығы № 8-3 шешімімен
title:
