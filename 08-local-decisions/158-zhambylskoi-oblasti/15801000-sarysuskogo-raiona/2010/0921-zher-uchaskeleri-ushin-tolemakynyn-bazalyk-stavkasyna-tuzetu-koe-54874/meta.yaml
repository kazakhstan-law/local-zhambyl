requisite: Жамбыл облысы Сарысу аудандық мәслихатының 2010 жылғы 21 қыркүйектегі № 42-8 шешімі. Жамбыл облысы Сарысу ауданының Әділет басқармасында 2010 жылғы 14 қазанда 6-9-101 нөмірімен тіркелді. Күші жойылды - Жамбыл облысы Сарысу аудандық мәслихатының 7 қыркүйектегі 2015 жылғы № 50-4 шешімімен
