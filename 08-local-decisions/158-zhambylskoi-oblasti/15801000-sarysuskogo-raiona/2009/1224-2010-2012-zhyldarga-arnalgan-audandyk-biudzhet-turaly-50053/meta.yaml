act_code: '50053'
requisite: Жамбыл облысы Сарысу аудандық мәслихатының 2009 жылғы 24 желтоқсандағы № 30-5 шешімі. Жамбыл облысы Сарысу ауданының Әділет басқармасында 2010 жылғы 19 қаңтарда 6-9-85 нөмірімен тіркелді. Күші жойылды - Жамбыл облысы Сарысу аудандық мәслихатының 2011 жылғы 8 маусымдағы № 51-11 шешімімен
