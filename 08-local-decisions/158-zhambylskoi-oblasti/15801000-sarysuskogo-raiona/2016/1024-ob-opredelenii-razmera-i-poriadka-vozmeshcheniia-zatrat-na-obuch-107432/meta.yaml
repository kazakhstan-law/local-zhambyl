  title:
    rus: О внесении изменений и дополнения в решение Сарысуского районного маслихата Жамбылской области от 24 октября 2016 года № 9-3 «Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Сарысусском районе»
    kaz: Сарысу аудандық мәслихатының 2016 жылғы 24 қазандағы № 9-3 «Сарысу ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы» шешіміне өзгерістер мен толықтыру енгізу туралы
