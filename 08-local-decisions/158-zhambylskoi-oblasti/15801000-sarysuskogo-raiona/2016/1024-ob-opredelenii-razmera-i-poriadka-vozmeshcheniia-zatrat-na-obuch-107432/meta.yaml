  title:
    rus: О внесении изменения в решение Сарысуского районного маслихата от 24 октября 2016 года №9-3 «Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Сарысуском районе»
    kaz: «Сарысу ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы» Сарысу аудандық мәслихатының 2016 жылғы 24 қазандағы № 9-3 шешіміне өзгеріс енгізу туралы
