title:
  rus: Об установлении порядка использования специальных мест, специальных мест для организации и проведения мирных собраний, норм их предельного наполнения, а также требований к материально-техническому и организационному обеспечению в Сарысуском районе
  kaz: Сарысу ауданында бейбіт жиналыстарды ұйымдастыру және өткізуге арналған арнайы орындар, арнайы орындарды пайдалану тәртібі, олардың шекті толу нормалары, сондай-ақ материалдық-техникалық және ұйымдастырушылықты қамтамасыз етуге қойылатын талаптарды белгілеу туралы
