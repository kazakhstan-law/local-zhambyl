act_code: '142480'
requisite: Решение Сарысуского районного маслихата Жамбылской области от 28 апреля 2020 года № 73-3. Зарегистрировано Департаментом юстиции Жамбылской области 30 апреля 2020 года № 4599. Утратило силу решением Сарысуского районного маслихата Жамбылской области от 24 мая 2023 года № 3-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении норм образования и накопления коммунальных отходов, тарифов на сбор, вывоз, утилизацию, переработку и захоронение твердых бытовых отходов по Сарысускому району
  kaz: Сарысу ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы
