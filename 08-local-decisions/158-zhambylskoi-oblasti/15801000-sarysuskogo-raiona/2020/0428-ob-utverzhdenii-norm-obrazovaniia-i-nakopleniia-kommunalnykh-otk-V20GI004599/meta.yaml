    kaz: Сарысу аудандық мәслихатының 2020 жылғы 28 сәуірдегі №73-3 «Сарысу ауданы бойынша коммуналдық қалдықтардың түзілу мен жинақталу нормаларын, тұрмыстық қатты қалдықтарды жинауға, әкетуге, кәдеге жаратуға, қайта өңдеуге және көмуге арналған тарифтерді бекіту туралы» шешімінің күші жойылды деп тану туралы
