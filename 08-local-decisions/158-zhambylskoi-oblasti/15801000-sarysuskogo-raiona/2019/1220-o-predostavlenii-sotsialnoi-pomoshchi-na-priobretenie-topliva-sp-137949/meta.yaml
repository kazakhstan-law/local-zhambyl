act_code: '137949'
requisite: Решение Сарысуского районного маслихата Жамбылской области от 20 декабря 2019 года № 66-3. Зарегистрировано Департаментом юстиции Жамбылской области 5 января 2020 года № 4486. Утратило силу решением Сарысуского районного маслихата Жамбылской области от 31 декабря 2021 года № 19-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам социального обеспечения, образования, культуры, спорта, ветеринарии и здравоохранения работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт, ветеринария және денсаулық сақтау ұйымдарының мамандарына отын сатып алу үшін көмек беру туралы
