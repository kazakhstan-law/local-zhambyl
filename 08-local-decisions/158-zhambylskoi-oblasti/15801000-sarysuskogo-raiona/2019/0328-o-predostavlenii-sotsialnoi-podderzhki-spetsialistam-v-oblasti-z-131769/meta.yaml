  title:
    rus: О внесении изменений в решение Сарысуского районного маслихата Жамбылской области от 28 марта 2019 года № 49-10 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района в 2019 году»
    kaz: «2019 жылы ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы» Жамбыл облысы Сарысу аудандық мәслихатының 2019 жылғы 28 наурыздағы № 49-10 шешіміне өзгерістер енгізу туралы
