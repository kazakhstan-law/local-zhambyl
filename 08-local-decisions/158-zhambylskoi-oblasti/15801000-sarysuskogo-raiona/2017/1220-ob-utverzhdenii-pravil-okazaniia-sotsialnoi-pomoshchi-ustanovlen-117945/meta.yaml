  title:
    rus: О внесении дополнения и изменения в решение Сарысуского районного маслихата от 20 декабря 2017 года № 25-6 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по Сарысускому району»
    kaz: «Сарысу ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» Сарысу аудандық мәслихатының 2017 жылғы 20 желтоқсандағы № 25-6 шешіміне толықтыру мен өзгеріс енгізу туралы
