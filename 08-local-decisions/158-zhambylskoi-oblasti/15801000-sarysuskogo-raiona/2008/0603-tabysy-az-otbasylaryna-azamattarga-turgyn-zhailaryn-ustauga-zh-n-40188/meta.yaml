act_code: '40188'
requisite: Жамбыл облысы Сарысу аудандық мәслихатының 2008 жылғы 3 маусымдағы № 8-3 шешімі. Жамбыл облысы Сарысу ауданының Әділет басқармасында 2008 жылғы 25 маусымда 6-9-61 нөмірімен тіркелді. Күші жойылды - Жамбыл облысы Сарысу аудандық мәслихатының 2010 жылғы 24 желтоқсандағы № 46-24 шешімімен
title:
