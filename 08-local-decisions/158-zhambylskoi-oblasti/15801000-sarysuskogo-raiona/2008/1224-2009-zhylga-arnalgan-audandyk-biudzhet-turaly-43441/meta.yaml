act_code: '43441'
requisite: Жамбыл облысы Сарысу аудандық мәслихатының 2008 жылғы 24 желтоқсандағы № 17-3 шешімі. Жамбыл облысы Сарысу ауданының Әділет басқармасында 2009 жылғы 14 қаңтарда № 6-9-71 тіркелді. Күші жойылды - Жамбыл облысы Сарысу аудандық мәслихатының 2010 жылғы 9 ақпандағы № 32-8 шешімімен
