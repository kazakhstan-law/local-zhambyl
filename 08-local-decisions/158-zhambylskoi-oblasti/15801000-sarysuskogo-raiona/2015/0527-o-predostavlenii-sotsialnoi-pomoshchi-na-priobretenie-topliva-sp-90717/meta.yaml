requisite: Решение маслихата Сарысуского района Жамбылской области от 27 мая 2015 года № 44-3. Зарегистрировано Департаментом юстиции Жамбылской области 12 июня 2015 года № 2666. Утратило силу решением Сарысуского районного маслихата Жамбылской области от 20.12.2019 № 66-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и  работающим в сельских населенных пунктах
  kaz: Ауыдық елді  мекендерде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып  алу үшін әлеуметтік көмек беру туралы
