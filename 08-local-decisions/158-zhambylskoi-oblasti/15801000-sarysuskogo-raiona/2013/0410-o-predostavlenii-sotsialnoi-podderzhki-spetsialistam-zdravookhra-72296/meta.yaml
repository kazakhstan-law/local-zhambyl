requisite: Решение Сарысуского районного маслихата Жамбылской области от 10 апреля 2013 года № 14-4. Зарегистрировано Департаментом юстиции Жамбылской области 30 апреля 2013 года № 1932. Утратило силу решением Сарысуского районного маслихата Жамбылской области от 17 апреля 2014 года № 27-2
title:
  rus: О предоставлении социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии прибывшим для работы и проживания в сельские населенные пункты Сарысуского района на 2013 год
  kaz: 2013 жылға арналған Сарысу ауданының ауылдық елді мекендерге жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау көрсету туралы
