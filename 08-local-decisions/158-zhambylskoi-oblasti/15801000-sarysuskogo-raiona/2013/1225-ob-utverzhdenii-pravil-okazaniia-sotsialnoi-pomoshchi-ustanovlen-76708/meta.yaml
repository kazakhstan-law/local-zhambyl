    kaz: '"Сарысу ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы" Сарысу аудандық мәслихатының 2013 жылғы 25 желтоқсандағы № 25-11 шешіміне өзгерістер мен толықтырулар енгізу туралы'
