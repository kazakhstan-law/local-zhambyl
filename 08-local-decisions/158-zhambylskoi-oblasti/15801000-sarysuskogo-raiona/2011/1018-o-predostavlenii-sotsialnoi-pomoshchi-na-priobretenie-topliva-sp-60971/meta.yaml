requisite: Решение Сарысуского районного маслихата Жамбылской области от 18 октября 2011 года № 55-4. Зарегистрировано Управлением юстиции Сарысуского района Жамбылской области 26 октября 2011 года за № 6-9-123. Утратило силу решением Сарысуского районного маслихата Жамбылской области от 30 ноября 2012 года № 10-4
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры и спорта, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу үшін әлеуметік көмек беру туралы
