requisite: Решение Сарысуского районного маслихата Жамбылской области от 8 июня 2011 года № 51-13. Зарегистрировано Управлением юстиции Сарысуского района Жамбылской области 23 июня 2011 года за № 6-9-119. Утратило силу решением Сарысуского районного маслихата Жамбылской области от 10 июня 2014 года № 30-5
title:
  rus: О предоставлении социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры и спорта, прибывшим для работы и проживания в сельские населенные пункты Сарысуского района в 2011 году
  kaz: 2011 жылға арналған Сарысу ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру,әлеуметтік қамсыздандыру, мәдениет және спорт мамандарына әлеуметтік қолдау ұсыну туралы
