act_code: '155826'
requisite: Решение Сарысуского районного маслихата Жамбылской области от 27 апреля 2021 года № 6-3. Зарегистрировано Департаментом юстиции Жамбылской области 4 мая 2021 года № 4970
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты района в 2021 году
  kaz: 2021 жылы ауданның ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы
