  title:
    rus: О внесении изменения в решение Сарысуского районного маслихата от 7 апреля 2021 года № 4-3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по Сарысускому району»
    kaz: Сарысу аудандық мәслихатының 2021 жылғы 7 сәуірдегі № 4-3 «Сарысу ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешiмiне өзгеріс енгізу туралы
