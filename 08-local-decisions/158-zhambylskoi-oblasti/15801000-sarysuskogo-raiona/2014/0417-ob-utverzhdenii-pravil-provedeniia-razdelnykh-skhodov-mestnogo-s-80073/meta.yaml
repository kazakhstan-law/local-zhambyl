act_code: '80073'
requisite: Решение Сарысуского районного маслихата Жамбылской области от 17 апреля 2014 года № 27-3. Зарегистрировано Департаментом юстиции Жамбылской области 20 мая 2014 года № 2223. Утратило силу решением Сарысуского районного маслихата Жамбылской области от 26 февраля 2024 года № 18-8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Сарысуском районе
  kaz: Сарысу ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы
