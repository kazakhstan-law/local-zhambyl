act_code: '43287'
requisite: Жамбыл облысы Жуалы аудандық мәслихатының 2008 жылғы 26 желтоқсандағы № 12-4 шешімі. Жамбыл облысы Жуалы ауданының Әділет басқармасында 2009 жылғы 12 қаңтарда 6-4-67 нөмірімен тіркелді. Күші жойылды - Жамбыл облысы Жуалы аудандық мәслихатының 2010 жылғы 4 ақпандағы № 24-5 шешімімен
