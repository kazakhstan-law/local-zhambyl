requisite: Решение Жуалынского районного маслихата Жамбылской области от 24 декабря 2010 года № 35-16. Зарегистрировано Департаментом юстиции Жамбылской области 13 января 2011 года за № 6-4-98. Утратило силу решением Жуалынского районного маслихата Жамбылской области от 5 сентября 2013 года № 20-5
title:
  rus: Об оказании единовременной социальной помощи для приобретения топлива специалистам здравоохранения, социального обеспечения образования культуры и спорта проживающим в сельских населенных пунктах и работающим в государственных организациях
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет және спорт ұйымдарының мамандарына отын сатып алу бойынша біржолғы әлеуметтік көмек көрсету туралы
