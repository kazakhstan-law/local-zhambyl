act_code: '154600'
requisite: Решение Жуалынского районного маслихата Жамбылской области от 12 апреля 2021 года № 6-2. Зарегистрировано Департаментом юстиции Жамбылской области 13 апреля 2021 года № 4935
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов села Б.Момышулы, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жуалынского района в 2021 году
  kaz: 2021 жылы Жуалы ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, Б.Момышұлы ауылы, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
