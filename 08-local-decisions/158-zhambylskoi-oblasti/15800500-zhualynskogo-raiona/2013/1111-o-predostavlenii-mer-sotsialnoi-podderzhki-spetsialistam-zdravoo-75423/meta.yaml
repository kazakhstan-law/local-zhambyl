requisite: Решение Жуалынского районного маслихата Жамбылской области от 11 ноября 2013 года № 22-6. Зарегистрировано Департаментом юстиции Жамбылской области 20 ноября 2013 года № 2052. Утратило силу решением Жуалынского районного маслихата Жамбылской области от 28 марта 2014 года № 26-6
title:
  rus: О предоставлении мер социальной поддержки специалистам здравоохранения, образования, социального обеспечения, культуры, спорта и ветеринарии, прибывшим для работы и проживания в сельские населенные пункты района в 2013 году
  kaz: 2013 жылы ауданның ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және ветеринария мамандарына әлеуметтік қолдау шараларын ұсыну туралы
