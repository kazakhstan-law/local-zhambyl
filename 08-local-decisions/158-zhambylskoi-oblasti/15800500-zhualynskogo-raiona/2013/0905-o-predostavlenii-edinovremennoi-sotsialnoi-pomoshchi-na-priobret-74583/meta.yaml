  title:
    rus: О внесении изменения в решение Жуалынского районного маслихата от 05 сентября 2013 года № 20-5 «О предоставлении единовременной социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах»
    kaz: «Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт  және ветеринария ұйымдарының мамандарына отын сатып алу үшін біржолғы әлеуметтік көмек беру туралы» Жуалы аудандық мәслихатының 2013 жылғы 05 қыркүйектегі № 20-5 шешіміне өзгеріс енгізу туралы
