  title:
    rus: О внесении изменений в решение Жуалынского районного маслихата от 6 июня 2014 года № 31-4 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по Жуалынскому району»
    kaz: Жуалы аудандық мәслихатының 2014 жылғы 6 маусымдағы № 31-4 «Жуалы ауданы бойынша әлеуметтік көмек көрсетудің,оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
