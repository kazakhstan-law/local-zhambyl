    kaz: «Жуалы ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Жуалы аудандық мәслихатының 2014 жылғы 6 маусымдағы № 31-4 шешіміне өзгерістер енгізу туралы
