requisite: Жамбыл облысы Жуалы аудандық мәслихатының 2009 жылғы 9 қазандағы № 20-5 шешімі. Жамбыл облысы Жуалы ауданының Әділет басқармасында 2009 жылғы 29 қазанда Нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 6-4-78 болып енгізілді. Күші жойылды - Жамбыл облысы Жуалы аудандық мәслихатының 2010 жылғы 4 ақпандағы № 24-5 шешімімен
