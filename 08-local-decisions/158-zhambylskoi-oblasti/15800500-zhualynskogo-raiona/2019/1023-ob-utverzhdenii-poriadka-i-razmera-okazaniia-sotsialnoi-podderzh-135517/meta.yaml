requisite: Решение Жуалынского районного маслихата Жамбылской области от 23 октября 2019 года № 52-5. Зарегистрировано Департаментом юстиции Жамбылской области 24 октября 2019 года № 4364
title:
  rus: Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах Жуалынского района
  kaz: Жуалы ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына коммуналдық қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы
