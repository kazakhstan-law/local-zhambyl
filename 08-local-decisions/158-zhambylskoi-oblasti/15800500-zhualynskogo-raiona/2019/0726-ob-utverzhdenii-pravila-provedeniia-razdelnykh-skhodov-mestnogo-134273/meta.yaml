act_code: '134273'
requisite: Решение Жуалынского районного маслихата Жамбылской области от 26 июля 2019 года № 49-3. Зарегистрировано Департаментом юстиции Жамбылской области 29 июля 2019 года № 4301. Утратило силу решением Жуалынского районного маслихата Жамбылской области от 11 декабря 2023 года № 12-6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правила проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, улицы, многоквартирного жилого дома  для участия в сходе местного сообщества в Жуалынском районе
  kaz: Жуалы ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы
