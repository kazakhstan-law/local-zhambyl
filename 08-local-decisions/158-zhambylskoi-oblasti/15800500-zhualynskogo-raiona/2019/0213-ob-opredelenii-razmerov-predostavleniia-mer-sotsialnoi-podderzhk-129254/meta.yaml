title:
  rus: Об определении размеров предоставления мер социальной поддержки специалистам в области  здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района в 2019 году
