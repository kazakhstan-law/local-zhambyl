act_code: '205306'
requisite: Решение Жуалынского районного маслихата Жамбылской области от 25 декабря 2024 года № 35-6
title:
  rus: О предоставлении в 2025 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов села Бауыржан Момышулы, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жуалынского района
  kaz: Жуалы ауданының ауылдық елді мекендеріне жұмыс істеуге және тұруға  келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, Бауыржан Момышұлы ауылы, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне 2025 жылы әлеуметтік қолдау шараларын ұсыну туралы
