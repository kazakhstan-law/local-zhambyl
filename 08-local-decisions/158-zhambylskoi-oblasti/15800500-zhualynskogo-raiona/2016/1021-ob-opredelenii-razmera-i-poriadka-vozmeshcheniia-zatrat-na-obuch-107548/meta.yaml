act_code: '107548'
requisite: Решение Жуалынского районного маслихата Жамбылской области от 21 октября 2016 года № 7-4. Зарегистрировано Департаментом юстиции Жамбылской области 16 ноября 2016 года № 3214. Утратило силу решением Жуалынского районного маслихата Жамбылской области от 28 февраля 2022 года № 20-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Жуалынском районе
  kaz: Жуалы ауданында мүгедек қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
