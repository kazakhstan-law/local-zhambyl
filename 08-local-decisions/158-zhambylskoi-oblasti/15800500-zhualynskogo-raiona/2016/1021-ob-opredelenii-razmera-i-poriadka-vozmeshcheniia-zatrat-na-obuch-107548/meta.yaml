  title:
    rus: О внесении изменений в решение маслихата Жуалынского района от 21 октября 2016 года № 7-4 «Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Жуалынском районе»
    kaz: Жуалы аудандық мәслихатының 2016 жылғы 21 қазандағы «Жуалы ауданында мүгедек қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы» № 7-4 шешіміне өзгерістер енгізу туралы
