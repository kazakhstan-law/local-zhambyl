requisite: Решение маслихата Жуалынского района Жамбылской области от 26 февраля 2016 года № 53-4. Зарегистрировано Департаментом юстиции Жамбылской области 28 марта 2016 года № 3003. Утратило силу решением Жуалынского районного маслихата Жамбылской области от 30.03.2017 № 11-6
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного  комплекса, прибывшим для работы и проживания в сельские населенные пункты района в 2016 году
  kaz: 2016 жылы ауданның ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына әлеуметтік қолдау көрсету туралы
