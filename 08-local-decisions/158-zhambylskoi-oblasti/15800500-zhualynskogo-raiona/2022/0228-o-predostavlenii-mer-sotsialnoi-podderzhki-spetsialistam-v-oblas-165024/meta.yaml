act_code: '165024'
requisite: Решение Жуалынского районного маслихата Жамбылской области от 28 февраля 2022 года № 20-4
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов села Б.Момышулы, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Жуалынского района в 2022 году
  kaz: 2022 жылы Жуалы ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, Бауыржан Момышұлы ауылы, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
