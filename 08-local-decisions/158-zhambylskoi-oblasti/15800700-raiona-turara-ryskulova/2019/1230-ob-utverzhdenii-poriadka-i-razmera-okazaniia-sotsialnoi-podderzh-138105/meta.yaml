  title:
    rus: О внесении изменений в решение маслихата района Т.Рыскулова Жамбылской области от 30 декабря 2019 года № 52-5 «Об утверждении порядка и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах района Т.Рыскулова»
    kaz: «Т.Рысқұлов ауданының ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебінен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету тәртібін және мөлшерін бекіту туралы» Жамбыл облысы Т. Рысқұлов аудандық мәслихатының 2019 жылғы 30 желтоқсандағы №52-5 шешіміне өзгерістер енгізу туралы
