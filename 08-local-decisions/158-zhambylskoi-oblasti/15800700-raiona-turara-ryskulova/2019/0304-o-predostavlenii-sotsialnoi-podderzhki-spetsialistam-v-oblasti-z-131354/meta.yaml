  title:
    rus: О внесении изменений в решение маслихата района Т. Рыскулова Жамбылской области  от 04 марта 2019 года № 38-7 «О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты района Т. Рыскулова в 2019 году»
    kaz: «2019 жылға Т. Рысқұлов ауданының елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы» Жамбыл облысы Т. Рысқұлов аудандық мәслихатының 2019 жылдың 04 наурыздағы № 38-7 шешіміне өзгерістер енгізу туралы
