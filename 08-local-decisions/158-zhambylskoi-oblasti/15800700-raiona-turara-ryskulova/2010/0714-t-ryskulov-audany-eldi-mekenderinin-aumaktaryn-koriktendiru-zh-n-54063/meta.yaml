act_code: '54063'
requisite: Жамбыл облысы Т. Рысқұлов аудандық мәслихатының 2010 жылғы 14 шілдедегі № 26-8 шешімі. Жамбыл облысы Т. Рысқұлов ауданының Әділет басқармасында 2010 жылғы 18 тамызда 6-8-107 нөмірімен тіркелді. Күші жойылды - Жамбыл облысы Т.Рысқұлов аудандық мәслихатының 2013 жылғы 21 маусымдағы № 4-08 шешімімен
