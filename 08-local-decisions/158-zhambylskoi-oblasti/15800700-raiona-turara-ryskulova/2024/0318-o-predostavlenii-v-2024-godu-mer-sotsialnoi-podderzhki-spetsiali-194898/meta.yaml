act_code: '194898'
requisite: Решение маслихата района Т.Рыскулова Жамбылской области от 18 марта 2024 года № 17-20
title:
  rus: О предоставлении в 2024 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, за исключением лиц, занимающих руководящие должности, прибывшим для работы и проживания в сельские населенные пункты  района Т.Рыскулова
  kaz: Т.Рысқұлов ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау,білім беру, әлеуметтік қамсыздандыру, мәдениет,спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтерәкімдері аппараттарының мемлекеттік қызметшілеріне, басшылауазымдарды атқаратынадамдарды қоспағанда, әлеуметтік қолдау шараларын 2024 жылы ұсыну туралы
