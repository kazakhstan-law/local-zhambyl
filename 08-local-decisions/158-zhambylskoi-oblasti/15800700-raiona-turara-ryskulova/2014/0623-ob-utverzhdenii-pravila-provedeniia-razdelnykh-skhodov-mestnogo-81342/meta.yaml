requisite: Решение маслихата района Т.Рыскулова Жамбылской области от 23 июня 2014 года № 25-11. Зарегистрировано Департаментом юстиции Жамбылской области от 17 июля 2014 года № 2278. Утратило силу решением маслихата района Т.Рыскулова Жамбылской области от 18 марта 2024 года № 17-19 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правила проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Т.Рыскуловском районе
  kaz: Т.Рысқұлов ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы
