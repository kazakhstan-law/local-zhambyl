  title:
    rus: О внесении изменений в решение маслихата района Т. Рыскулова от 12 апреля 2017 года № 14-5 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по району Т. Рыскулова»
    kaz: «Т. Рысқұлов ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеу және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидасын бекіту туралы» Т. Рысқұлов аудандық мәслихатының 2017 жылдың 12 сәуірдегі № 14-5 шешіміне өзгерістер енгізу туралы
