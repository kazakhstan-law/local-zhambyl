  title:
    rus: О внесении изменений в решение маслихата района Т.Рыскулова от 12 апреля 2017 года № 14-5 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по району Т.Рыскулова»
