act_code: '208913'
requisite: Решение маслихата района Т. Рыскулова Жамбылской области от 31 марта 2025 года № 32-10
title:
  rus: Об утверждении размеров предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты района Т. Рыскулова в 2025 году
  kaz: Т. Рысқұлов ауданының ауылдық елді мекендерге 2025 жылы жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға,  ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шаралары ұсыну мөлшерін бекіту туралы
