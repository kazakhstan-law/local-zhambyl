requisite: Решение маслихата района Т. Рыскулова Жамбылской области от 6 апреля 2015 года № 31-9. Зарегистрировано Департаментом юстиции Жамбылской области 17 апреля 2015 года № 2613. Утратило силу решением маслихата района Т.Рыскулова Жамбылской области от 22 февраля 2016 года № 42-5
title:
