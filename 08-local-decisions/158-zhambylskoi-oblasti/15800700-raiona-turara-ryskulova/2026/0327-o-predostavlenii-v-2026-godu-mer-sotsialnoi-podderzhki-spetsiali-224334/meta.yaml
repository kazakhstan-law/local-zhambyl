act_code: '224334'
requisite: Решение маслихата района Т. Рыскулова Жамбылской области от 27 марта 2026 года № 50-9
title:
  rus: О предоставлении в 2026 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, за исключением лиц, занимающих руководящие должности,  прибывшим для работы и проживания в сельские населенные пункты  района Т. Рыскулова
  kaz: Т. Рысқұлов ауданының ауылдық елді мекендеріне 2026 жылы жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне, басшы лауазымдарды атқаратын адамдарды қоспағанда, әлеуметтік қолдау шараларын ұсыну туралы
