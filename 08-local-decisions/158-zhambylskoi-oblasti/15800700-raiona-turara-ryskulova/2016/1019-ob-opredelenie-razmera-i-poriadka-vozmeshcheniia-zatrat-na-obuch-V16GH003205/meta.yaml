  rus: Об определение размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов индивидуальному учебному плану в Т.Рыскуловском районе
  kaz: Т.Рысқұлов ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
