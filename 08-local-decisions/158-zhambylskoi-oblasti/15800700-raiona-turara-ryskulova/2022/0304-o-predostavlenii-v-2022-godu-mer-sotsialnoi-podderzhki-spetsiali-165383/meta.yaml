act_code: '165383'
requisite: Решение маслихата района Т. Рыскулова Жамбылской области от 4 марта 2022 года № 15-6
title:
  rus: О предоставлении в 2022 году мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, за исключением лиц, занимающих руководящие должности,  прибывшим для работы и проживания в сельские населенные пункты  района Т.Рыскулова
  kaz: Т.Рысқұлов ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау,білім беру, әлеуметтік қамсыздандыру, мәдениет,спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне, басшы лауазымдарды атқаратын адамдарды қоспағанда, әлеуметтік қолдау шараларын 2022 жылы ұсыну туралы
