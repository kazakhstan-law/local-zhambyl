act_code: '43531'
requisite: Жамбыл облысы Т. Рысқұлов аудандық мәслихатының 2009 жылғы 25 ақпандағы № 14-3 шешімі. Жамбыл облысы Т. Рысқұлов ауданының Әділет басқармасында 2009 жылғы 13 наурызда 6-8-77 нөмірімен тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Жамбыл облыстық Әділет департаментінің 2013 жылғы 11 наурыздағы № 2-2-17/388 хаты)
title:
