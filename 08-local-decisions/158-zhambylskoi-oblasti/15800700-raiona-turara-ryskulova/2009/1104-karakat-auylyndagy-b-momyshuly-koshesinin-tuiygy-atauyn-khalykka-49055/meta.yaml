act_code: '49055'
requisite: Жамбыл облысы Т. Рысқұлов ауданы Құлан ауылдық округі әкімінің 2009 жылғы 4 қарашадағы № 143 шешімі. Жамбыл облысы Т. Рысқұлов ауданының Әділет басқармасында 2009 жылғы 7 желтоқсанда 6-8-87 нөмірімен тіркелді
