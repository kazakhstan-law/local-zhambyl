act_code: '19278'
requisite: Жамбыл облысы Т. Рысқұлов аудандық мәслихат сессиясының 2004 жылға 20 ақпандағы № 4-14 шешімі. Жамбыл облыстық Әділет Департаментінде 2004 жылғы 1 сәуірде № 1290 тіркелді. Күші жойылды - Жамбыл облысы Т. Рысқұлов аудандық мәслихатының 2008 жылғы 26 ақпандағы № 4-5 шешімімен
