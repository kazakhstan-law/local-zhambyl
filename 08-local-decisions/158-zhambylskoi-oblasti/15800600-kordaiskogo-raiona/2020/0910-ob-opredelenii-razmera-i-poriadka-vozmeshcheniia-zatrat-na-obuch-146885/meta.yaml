  title:
    rus: О внесении изменения в решение Кордайского районного маслихата от 10 сентября 2020 года № 73-4 «Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Кордайском районе»
    kaz: Қордай аудандық мәслихатының 2020 жылғы 10 қыркүйектегі №73-4 «Қордай ауданында мүгедек қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы» шешіміне өзгеріс енгізу туралы
