  title:
    rus: О внесении изменений в решение маслихата от 10 сентября 2020 года № 73-4 «Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Кордайском районе»
    kaz: Мәслихаттың 2020 жылғы 10 қыркүйектегі №73-4 «Қордай ауданында жеке оқыту жоспары бойынша мүгедектер қатарындағы кемтар балаларды үйде оқытуға жұмсалған шығындарды өтеу тәрітібі мен мөлшерін айқындау туралышығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы» шешіміне өзгерістер енгізу туралы
