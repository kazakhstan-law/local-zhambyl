title:
  rus: Об определении размера о предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения,  культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Кордайского района на 2020 год
