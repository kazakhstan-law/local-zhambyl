act_code: '144483'
requisite: Решение Кордайского районного маслихата Жамбылской области от 25 июня 2020 года № 68-2. Зарегистрировано Департаментом юстиции Жамбылской области 3 июля 2020 года № 4669
title:
  rus: Об определении специализированных мест, порядка использования специализированных мест, норм их предельного наполнения, а также требований к материально-техническому и организационному обеспечению для организации и проведения мирных собраний в Кордайском районе
  kaz: Қордай ауданында бейбіт жиналыстарды ұйымдастыру және өткізуге арналған арнайы орындар, арнайы орындарды пайдалану тәртібі, олардың шекті толу нормалары, сондай-ақ материалдық-техникалық және ұйымдастырушылық қамтамасыз етуге қойылатын талаптарды айқындау туралы
