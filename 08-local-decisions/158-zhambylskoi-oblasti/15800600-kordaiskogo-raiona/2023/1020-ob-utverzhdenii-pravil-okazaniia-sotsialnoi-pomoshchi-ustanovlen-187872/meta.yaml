  title:
    rus: О внесении изменений и дополнений в решение Кордайского районного маслихата от 20 октября 2023 года № 10-3 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по Кордайскому району»
    kaz: Қордай аудандық мәслихатының 2023 жылғы 20 қазандағы № 10-3 «Қордай ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгерістер мен толықтырулар енгізу туралы
