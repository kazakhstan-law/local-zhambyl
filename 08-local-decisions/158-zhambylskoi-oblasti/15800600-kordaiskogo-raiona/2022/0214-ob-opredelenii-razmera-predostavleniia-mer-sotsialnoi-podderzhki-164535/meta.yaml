act_code: '164535'
requisite: Решение Кордайского районного маслихата Жамбылской области от 14 февраля 2022 года № 20-4
title:
  rus: Об определении размера предоставления  мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Кордайского района, на 2022 год
  kaz: 2022 жылға Қордай ауданының «Ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне» әлеуметтік қолдау шараларын ұсыну мөлшерін айқындау туралы
