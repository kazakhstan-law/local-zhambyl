act_code: '217806'
requisite: Решение Кордайского районного маслихата Жамбылской области от 28 ноября 2025 года № 52-5
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения,образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Кордайского района в 2026 году
  kaz: «2026 жылы Қордай  ауданының  ауылдық елді мекендеріне жұмыс істеуге және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау шараларын ұсыну туралы
