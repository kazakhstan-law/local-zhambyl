requisite: Решение Кордайского районного маслихата Жамбылской области от 22 мая 2014 года № 31-7. Зарегистрировано Департаментом юстиции Жамбылской области 18 июня 2014 года № 2243. Утратило силу решением Кордайского районного маслихата Жамбылской области от 5 мая 2023 года № 2-5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Кордайском районе
  kaz: Қордай ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше,  көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы
