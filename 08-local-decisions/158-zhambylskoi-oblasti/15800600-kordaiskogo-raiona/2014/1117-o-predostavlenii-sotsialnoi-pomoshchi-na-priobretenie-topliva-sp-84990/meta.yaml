act_code: '84990'
requisite: Решение Кордайского районного маслихата Жамбылской области от 17 ноября 2014 года № 35-7. Зарегистрировано Департаментом юстиции Жамбылской области 11 декабря 2014 года № 2421. Утратило силу решением Кордайского районного маслихата Жамбылской области от 30 марта 2020 года № 65-5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций социального обеспечения, образования, культуры, спорта и агропромышленного комплекса, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және агроөнеркәсіптік кешен ұйымдарының мамандарына отын сатып алу үшін әлеуметтік көмек беру туралы
