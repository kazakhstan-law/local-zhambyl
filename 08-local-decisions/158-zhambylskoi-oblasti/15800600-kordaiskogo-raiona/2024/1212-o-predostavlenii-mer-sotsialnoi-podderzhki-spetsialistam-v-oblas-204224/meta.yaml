act_code: '204224'
requisite: Решение Кордайского районного маслихата Жамбылской области от 12 декабря 2024 года № 36-6
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Кордайского района на 2025 год
  kaz: Қордай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне, денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2025 жылға арналған әлеуметтік қолдау шараларын ұсыну туралы
