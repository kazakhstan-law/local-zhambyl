act_code: '194460'
requisite: Решение Кордайского районного маслихата Жамбылской области от 15 марта 2024 года № 21-3
title:
  rus: О предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Кордайского района на 2024 год
  kaz: Қордай ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне, денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға 2024 жылға арналған  әлеуметтік қолдау шараларын ұсыну туралы
