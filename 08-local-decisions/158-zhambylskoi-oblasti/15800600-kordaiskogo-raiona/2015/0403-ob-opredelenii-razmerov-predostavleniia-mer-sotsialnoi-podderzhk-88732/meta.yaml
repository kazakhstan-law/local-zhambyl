requisite: Решение маслихата Кордайского района Жамбылской области от 3 апреля 2015 года № 40-3. Зарегистрировано Департаментом юстиции Жамбылской области 16 апреля 2015 года № 2610. Утратило силу решением Кордайского районного маслихата Жамбылской области от 27.03.2019 № 47-9
title:
  rus: Об определении размеров предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания  в сельские населенные пункты Кордайского района
  kaz: Қордай ауданының ауылдық елді мекендерге жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау шараларын ұсыну мөлшерін  айқындау  туралы
