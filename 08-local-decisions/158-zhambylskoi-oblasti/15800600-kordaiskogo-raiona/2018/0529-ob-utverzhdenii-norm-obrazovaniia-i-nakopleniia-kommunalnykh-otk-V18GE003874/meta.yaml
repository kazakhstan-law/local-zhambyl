    kaz: Қордай аудандық мәслихатының 2018 жылғы 29 мамырдағы №32-3 «Қордай ауданы бойынша коммуналдық қалдықтардың түзілу және жинақталу нормаларын және тұрмыстық қатты қалдықтарды жинауға, әкетуге және көмуге арналған тарифтерді бекіту туралы» шешімінің күші жойылды деп тану туралы
