requisite: Решение Кордайского районного маслихата Жамбылской области от 29 мая 2018 года № 32-3. Зарегистрировано Департаментом юстиции Жамбылской области 25 июня 2018 года № 3874. Утратило силу решением Кордайского районного маслихата Жамбылской области от 26 декабря 2022 года № 33-9 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
