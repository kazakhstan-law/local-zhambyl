  title:
    rus: О внесении дополнения в решение Кордайского районного  маслихата от 26 марта 2018 года № 29-9 «Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по Кордайскому району»
    kaz: «Қордай ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» Қордай аудандық мәслихатының 2018 жылғы 26 наурыздағы № 29-9 шешіміне толықтыру енгізу туралы
