act_code: '107069'
requisite: Решение Кордайского районного маслихата Жамбылской области от 10 октября 2016 года №6-2. Зарегистрировано Департаментом юстиции Жамбылской области 20 октября 2016 года № 3182. Утратило силу решением Кордайского районного маслихата Жамбылской области от 10 сентября 2020 года № 73-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Кордайском районе
  kaz: Қордай ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
