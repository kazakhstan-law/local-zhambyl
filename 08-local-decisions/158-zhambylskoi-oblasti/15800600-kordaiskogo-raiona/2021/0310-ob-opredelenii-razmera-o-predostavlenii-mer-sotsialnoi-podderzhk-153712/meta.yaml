act_code: '153712'
requisite: Решение Кордайского районного маслихата Жамбылской области от 10 марта 2021 года № 3-3. Зарегистрировано Департаментом юстиции Жамбылской области 19 марта 2021 года № 4915
title:
  rus: Об определении размера о предоставлении мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельских округов, прибывшим для работы и проживания в сельские населенные пункты Кордайского района на 2021 год
  kaz: 2021 жылға Қордай ауданының «Ауылдық елдi мекендерге жұмыс iстеуге және тұруға келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округтер әкімдері аппараттарының мемлекеттік қызметшілеріне» әлеуметтік қолдау шараларын ұсыну мөлшерін айқындау туралы
