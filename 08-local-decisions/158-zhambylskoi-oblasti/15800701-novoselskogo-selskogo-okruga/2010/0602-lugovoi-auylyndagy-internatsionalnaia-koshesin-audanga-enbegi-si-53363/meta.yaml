act_code: '53363'
requisite: Жамбыл облысы Т.Рысқұлов ауданы әкімдігі Луговой ауыл аймағы әкімінің 2010 жылғы 2 маусымдағы № 43 шешімі. Жамбыл облысы Т.Рысқұлов ауданының Әділет басқармасында 2010 жылғы 1 шілдеде 6-8-104 нөмірімен тіркелді
