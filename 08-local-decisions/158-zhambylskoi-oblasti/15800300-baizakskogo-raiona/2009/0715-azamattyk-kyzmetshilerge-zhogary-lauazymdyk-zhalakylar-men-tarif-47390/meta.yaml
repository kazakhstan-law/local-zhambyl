requisite: Жамбыл облысы Байзақ аудандық мәслихатының 2009 жылғы 15 шілдедегі № 19-9 шешімі. Жамбыл облысы Байзақ ауданының Әділет басқармасында 2009 жылғы 14 тамызда Нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 6-2-94 болып енгізілді. Күші жойылды - Жамбыл облысы Байзақ аудандық мәслихатының 22.06.2016 № 4-7 шешімімен
