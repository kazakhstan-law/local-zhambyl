    kaz: «Байзақ ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарына 2019 жылға әлеуметтік қолдау көрсету туралы» Байзақ аудандық мәслихатының 2019 жылғы 2 сәуірдегі № 44-3 шешіміне өзгеріс енгізу туралы
