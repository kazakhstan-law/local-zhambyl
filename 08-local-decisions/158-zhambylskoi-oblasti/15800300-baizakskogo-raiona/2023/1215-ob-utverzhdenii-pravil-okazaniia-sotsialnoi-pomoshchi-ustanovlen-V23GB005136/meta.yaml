  title:
    rus: О внесении изменение в решение маслихата Байзакского района Жамбылской области от 15 декабря 2023 года № 14-3 «Об утверждении правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан по Байзакскому району»
    kaz: «Байзақ ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың қағидаларын бекіту туралы» Жамбыл облысы Байзақ аудандық мәслихатының 2023 жылғы 15 желтоқсандағы № 14-3 шешіміне өзгерістер енгізу туралы
