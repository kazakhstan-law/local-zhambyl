  title:
    rus: О внесении изменений и дополнений в решение Байзакского районного маслихата Жамбылской области от 15 декабря 2023 года № 14-3 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан по Байзакскому району»
