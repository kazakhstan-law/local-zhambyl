act_code: '80640'
requisite: Решение Байзакского районного маслихата Жамбылской области от 16 мая 2014 года № 30-2. Зарегистрировано Департаментом юстиции Жамбылской области 12 июня 2014 года № 2240. Утратило силу решением Байзакского районного маслихата Жамбылской области от 26 февраля 2024 года № 18-5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественный состав представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества Байзакского района
  kaz: Байзақ ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы
