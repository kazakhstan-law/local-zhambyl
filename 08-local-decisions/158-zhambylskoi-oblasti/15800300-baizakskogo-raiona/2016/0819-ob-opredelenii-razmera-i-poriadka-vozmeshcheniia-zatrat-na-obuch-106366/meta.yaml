requisite: Решение Байзакского районного маслихата Жамбылской области от 19 августа 2016 года №6-5. Зарегистрировано Департаментом юстиции Жамбылской области 19 сентября 2016 года № 3159. Утратило силу решением Байзакского районного маслихата Жамбылской области от 30 марта 2022 года № 24-5 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану  в Байзакском районе
  kaz: Байзақ ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
