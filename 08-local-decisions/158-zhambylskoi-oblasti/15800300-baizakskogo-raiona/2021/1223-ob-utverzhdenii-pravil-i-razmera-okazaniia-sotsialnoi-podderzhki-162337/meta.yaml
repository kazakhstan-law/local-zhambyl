act_code: '162337'
requisite: Решение Байзакского районного маслихата Жамбылской области от 23 декабря 2021 года № 20-7. Зарегистрировано в Министерстве юстиции Республики Казахстан 27 декабря 2021 года № 26108
title:
  rus: Об утверждении Правил и размера оказания социальной поддержки по оплате коммунальных услуг и приобретению топлива за счет бюджетных средств специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии проживающим и работающим в сельских населенных пунктах Байзакского района
  kaz: Байзақ ауданының ауылдық елді мекендерінде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына бюджет қаражаты есебiнен коммуналдық көрсетілетін қызметтерге ақы төлеу және отын сатып алу бойынша әлеуметтік қолдау көрсету Қағидасы мен мөлшерін бекіту туралы
