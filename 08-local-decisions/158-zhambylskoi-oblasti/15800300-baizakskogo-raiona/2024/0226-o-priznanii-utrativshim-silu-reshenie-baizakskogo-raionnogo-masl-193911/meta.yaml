act_code: '193911'
requisite: Решение Байзакского районного маслихата Жамбылской области от 26 февраля 2024 года № 18-5. Зарегистрировано Департаментом юстиции Жамбылской области от 29 февраля 2024 года № 5157-08
title:
  rus: О признании утратившим силу решение Байзакского районного маслихата от 16 мая 2014 года №30-2 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественный состав представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества Байзакского района»
  kaz: «Байзақ ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы» Байзақ аудандық мәслихатының 2014 жылғы 16 мамырдағы №30-2 шешімінің күшін жою туралы
