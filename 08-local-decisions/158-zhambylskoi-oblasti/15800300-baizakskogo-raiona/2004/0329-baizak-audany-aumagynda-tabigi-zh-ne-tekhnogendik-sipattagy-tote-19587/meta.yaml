act_code: '19587'
requisite: Жамбыл облысы Байзақ аудандық мәслихатының 2004 жылғы 30 наурыздағы № 4-4 шешімі. Жамбыл облыстық әділет Департаментінде 2004 жылғы 28 сәуірде № 1335 тіркелді. Күші жойылды - Жамбыл облысы Байзақ аудандық мәслихатының 2012 жылғы 27 маусымдағы № 7-12 шешімімен
