act_code: '19694'
requisite: Жамбыл облысы Байзақ аудандық мәслихатының 2004 жылғы 30 наурыздағы № 4-3 шешімі. Жамбыл облыстық Әділет департаментінде 2004 жылғы 7 мамырда № 1346 тіркелді. Күші жойылды - Жамбыл облысы Байзақ аудандық мәслихатының 2012 жылғы 27 маусымдағы № 7-11 шешімімен
title:
  rus: Аудандағы жасыл желектерді күтіп ұстау мен қорғау, елді мекендердің аумақтарын көріктендіру, мал дәрігерлік заңдарды сақтау және иттер мен мысықтарды күтіп ұстау жөніндегі Ережелерді бекіту туралы
