  title:
    rus: Аудандық Мәслихаттың 2004 жылғы 30 наурыздағы кезектен тыс ІV-сессиясының № 4-3 "Аудандағы жасыл желектерді күтіп ұстау мен қорғау, елді мекендердің аумақтарын көріктендіру, мал дәрігерлік заңдарды сақтау және иттер мен мысықтарды күтіп ұстау жөніндегі Ережелерді бекіту туралы" шешіміне өзгеріс енгізу туралы
