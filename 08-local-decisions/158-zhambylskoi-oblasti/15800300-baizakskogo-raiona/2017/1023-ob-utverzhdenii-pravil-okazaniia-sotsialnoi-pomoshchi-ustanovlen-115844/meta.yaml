requisite: Решение Байзакского районного маслихата Жамбылской области от 23 октября 2017 года № 19-12. Зарегистрировано Департаментом юстиции Жамбылской области 3 ноября 2017 года № 3572. Утратило силу решением Байзакского районного маслихата Жамбылской области от 23 декабря 2020 года № 77-11 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил оказания социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся граждан по Байзакскому району
  kaz: «Байзақ ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы»
