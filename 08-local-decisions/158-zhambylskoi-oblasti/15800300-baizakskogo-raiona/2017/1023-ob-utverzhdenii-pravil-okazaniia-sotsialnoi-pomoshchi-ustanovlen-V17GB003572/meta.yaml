  title:
    rus: О внесении изменений и дополнений в решение Байзакского районного маслихата от 23 октября 2017 года № 19-12 «Об утверждении  Правил оказания  социальной помощи, установления размеров и определения перечня отдельных категорий нуждающихся  граждан по Байзакскому району»
    kaz: «Байзақ ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекеленген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» Байзақ аудандық мәслихатының 2017 жылғы 23 қазандағы № 19-12 шешіміне өзгерістер мен толықтырулар енгізу туралы
