act_code: '114376'
requisite: Решение Байзакского районного маслихата Жамбылской области от 22 августа 2017 года № 18-4. Зарегистрировано Департаментом юстиции Жамбылской области 29 августа 2017 года № 3516. Утратило силу решением Байзакского районного маслихата Жамбылской области от 19.12.2019 № 59-9 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальной помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елдi мекендерде тұратын және жұмыс істейтiн мемлекеттiк денсаулық сақтау, әлеуметтiк қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін көмек беру туралы
