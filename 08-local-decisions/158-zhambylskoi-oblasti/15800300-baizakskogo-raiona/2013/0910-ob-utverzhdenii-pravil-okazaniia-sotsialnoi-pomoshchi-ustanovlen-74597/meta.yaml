    kaz: '"Байзақ ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы" Байзақ аудандық мәслихатының 2013 жылғы 10 қыркүйектегі № 20-3 шешіміне өзгерістер енгізу туралы'
