act_code: '140301'
requisite: Решение Байзакского районного маслихата Жамбылской области от 10 марта 2020 года № 62-3. Зарегистрировано Департаментом юстиции Жамбылской области 16 марта 2020 года № 4522. Утратило силу решением Байзакского районного маслихата Жамбылской области от 26 марта 2025 года № 42-5 (подлежит исполнению по истечении десяти календарных дней со дня его первого официального опубликования)
title:
  rus: О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Байзакского района
  kaz: Байзақ ауданының ауылдық елді мекендерде жұмыс істеу және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы
