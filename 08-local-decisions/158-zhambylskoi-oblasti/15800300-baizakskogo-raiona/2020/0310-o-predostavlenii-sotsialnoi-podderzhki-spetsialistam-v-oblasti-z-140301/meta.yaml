  title:
    rus: О внесении изменений в решение Байзакского районного маслихата от 10 марта 2020 года № 62-3 «О предоставлении социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, прибывшим для работы и проживания в сельские населенные пункты Байзакского района»
    kaz: Байзақ аудандық мәслихатының 2020 жылғы 10 наурыздағы «Байзақ ауданының ауылдық елді мекендерде жұмыс істеу және тұруға келген денсаулық сақтау, білім беру, әлеуметтік қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға әлеуметтік қолдау көрсету туралы» № 62-3 шешіміне өзгеріс енгізу туралы
