  title:
    rus: О внесении изменений в решение Байзакского районного маслихата от 23 декабря 2020 года №77-11 «Об утверждении Правил оказания социальной помощи, установления  размеров и определения перечня отдельных категорий нуждающихся граждан по Байзакскому району»
    kaz: Байзақ аудандық мәслихатының 2020 жылғы 23 желтоқсандағы №77-11 «Байзақ ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
