act_code: '154265'
requisite: Решение Таласского районного маслихата Жамбылской области от 30 марта 2021 года № 4. Зарегистрировано Департаментом юстиции Жамбылской области 2 апреля 2021 года № 4930
title:
  rus: О предоставления мер социальной поддержки специалистам в области здравоохранения, образования, социального обеспечения, культуры, спорта и агропромышленного комплекса, государственным служащим аппаратов акимов сел, поселков, сельского округа, прибывшим для работы и проживания в сельские населенные пункты Таласского района в 2021 году
  kaz: 2021 жылы Талас ауданының ауылдық елді мекендеріне жұмыс істеу және тұру үшін келген денсаулық сақтау, бiлiм беру, әлеуметтiк қамсыздандыру, мәдениет, спорт және агроөнеркәсіптік кешен саласындағы мамандарға, ауылдар, кенттер, ауылдық округ әкімдері аппараттарының мемлекеттік қызметшілеріне әлеуметтік қолдау көрсету туралы
