requisite: Решение маслихата Таласского района Жамбылской области от 17 августа 2016 года №7-3. Зарегистрировано Департаментом юстиции Жамбылской области 31 августа 2016 года № 3154. Утратило силу решением Таласского районного маслихата Жамбылской области от 9 октября 2020 года № 80-6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану  в Таласском районе
  kaz: Талас ауданында мүгедектер қатарындағы кемтар балаларды жеке  оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарын өндіріп алу мөлшерін және тәртібін айқындау туралы
