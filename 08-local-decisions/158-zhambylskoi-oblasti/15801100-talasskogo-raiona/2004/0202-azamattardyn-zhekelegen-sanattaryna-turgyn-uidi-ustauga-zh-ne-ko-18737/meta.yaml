requisite: Жамбыл облысы Талас аудандық мәслихатының 2004 жылғы 2 ақпандағы № 3-6 қаулысы. Жамбыл облыстық әділет департаментінде 2004 жылғы 18 ақпанда 1205 нөмерімен тіркелді. Күші жойылды - Жамбыл облысы Талас аудандық мәслихатының 2008 жылғы 30 маусымдағы № 11-13 шешімімен
