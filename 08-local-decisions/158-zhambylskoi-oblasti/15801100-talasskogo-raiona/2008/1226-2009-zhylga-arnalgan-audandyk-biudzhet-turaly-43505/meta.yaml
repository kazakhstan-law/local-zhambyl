act_code: '43505'
requisite: Жамбыл облысы Талас аудандық мәслихатының 2008 жылғы 26 желтоқсандағы № 16-7 шешімі. Жамбыл облысы Талас ауданының Әділет басқармасында 2009 жылғы 15 қаңтарда 6-10-71 нөмірімен тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Жамбыл облыстық Әділет департаментінің 2013 жылғы 11 наурыздағы № 2-2-17/388 хаты)
