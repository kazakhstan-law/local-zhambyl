act_code: '81772'
requisite: Решение Таласского районного маслихата Жамбылской области от 24 июля 2014 года № 35-10. Зарегистрировано Департаментом юстиции Жамбылской области 6 августа 2014 года № 2288. Утратило силу решением Таласского районного маслихата Жамбылской области от 13 марта 2024 года № 17-8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликование)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Таласском районе
  kaz: Талас ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы
