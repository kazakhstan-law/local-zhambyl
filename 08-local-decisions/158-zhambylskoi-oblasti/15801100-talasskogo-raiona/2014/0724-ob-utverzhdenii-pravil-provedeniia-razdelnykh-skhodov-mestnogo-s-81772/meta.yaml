  title:
    rus: О внесении дополнения в решение Таласского районного маслихата от 24 июля 2014 года № 35 – 10 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Таласском районе»
    kaz: «Талас ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы» Талас аудандық мәслихатының 2014 жылғы 24 шілдедегі № 35 - 10 шешіміне толықтыру енгізу туралы
