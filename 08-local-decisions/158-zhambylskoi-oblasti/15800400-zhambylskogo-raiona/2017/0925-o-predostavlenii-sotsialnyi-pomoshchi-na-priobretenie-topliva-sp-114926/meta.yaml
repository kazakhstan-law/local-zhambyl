act_code: '114926'
requisite: Решение Жамбылского районного маслихата Жамбылской области от 25 сентября 2017 года № 17-2. Зарегистрировано Департаментом юстиции Жамбылской области 27 сентября 2017 года № 3536. Утратило силу решением Жамбылского районного маслихата Жамбылской области от 25 июня 2020 года № 64-4 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О предоставлении социальный помощи на приобретение топлива специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах
  kaz: Ауылдық елді мекендерде тұратын және жұмыс істейтін мемлекеттік денсаулық сақтау, әлеуметтік қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін көмек беру туралы
