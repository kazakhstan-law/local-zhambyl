  title:
    rus: О внесении изменений в решение Жамбылского районного маслихата от 25 сентября 2017 года № 17-2 «О предоставлении социальной помощи на приобретение топлива  специалистам государственных организаций здравоохранения, социального обеспечения, образования, культуры, спорта и ветеринарии, проживающим и работающим в сельских населенных пунктах»
    kaz: «Ауылдық елдi мекендерде тұратын және жұмыс істейтiн мемлекеттiк денсаулық сақтау, әлеуметтiк қамсыздандыру, білім беру, мәдениет, спорт және ветеринария ұйымдарының мамандарына отын сатып алу үшін көмек беру туралы» Жамбыл аудандық мәслихатының 2017 жылғы 25 қыркүйектегі №17-2 шешіміне өзгеріс енгізу туралы
