act_code: '165456'
requisite: Решение Жамбылского районного маслихата Жамбылской области от 4 марта 2022 года № 16-2. Зарегистрировано в Министерстве юстиции Республики Казахстан 10 марта 2022 года № 27061. Утратило силу решением Жамбылского районного маслихата Жамбылской области от 13 сентября 2023 года № 7-8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении порядка и размера возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану в Жамбылском районе
  kaz: Жамбыл ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсаған шығындарды өндіріп алу тәртібі мен мөлшерін айқындау туралы
