act_code: '50191'
requisite: Жамбыл облысы Жамбыл ауданы әкімінің 2009 жылғы 29 желтоқсандағы № 05 шешімі. Жамбыл облысы Жамбыл ауданының Әділет басқармасында 2010 жылғы 22 қаңтарда Нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 6-3-107 болып енгізілді. Қаулысының қабылдау мерзімінің өтуіне байланысты күші жойылды (Жамбыл ауданы әкімі аппаратының 2012 жылғы 8 маусымдағы № 3/904 хаты)
title:
  rus: 2010 жылы Жамбыл ауданының аумағында тұратын 1993 жылы туылған еркек жынысты азаматтарды шақыру учаскесіне тіркеуді ұйымдастыру туралы
