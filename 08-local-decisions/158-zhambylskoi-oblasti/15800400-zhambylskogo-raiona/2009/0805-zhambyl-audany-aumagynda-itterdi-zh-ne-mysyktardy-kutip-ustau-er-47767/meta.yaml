requisite: Жамбыл облысы Жамбыл аудандық мәслихатының 2009 жылғы 5 тамыздағы № 22/5 шешімі. Жамбыл облысы Жамбыл ауданының Әділет басқармасында 2009 жылғы 11 қыркүйекте 6-3-90 нөмірімен тіркелді. Күші жойылды - Жамбыл облысы Жамбыл аудандық мәслихатының 2012 жылғы 15 маусымдағы № 7-2 шешімімен
