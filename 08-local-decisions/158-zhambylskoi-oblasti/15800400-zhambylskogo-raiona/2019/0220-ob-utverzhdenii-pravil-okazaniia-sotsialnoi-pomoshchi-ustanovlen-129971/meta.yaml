    kaz: «Жамбыл ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген  санаттарының тізбесін айқындаудың Қағидаларын бекiту туралы» Жамбыл аудандық мәслихатының 2019 жылғы 20 ақпандағы №38-3 шешіміне толықтырулар мен өзгерістер енгізу туралы
