act_code: '108245'
requisite: Решение Жамбылского районного маслихата Жамбылской области от 30 ноября 2016 года № 6-8. Зарегистрировано Департаментом юстиции Жамбылской области 12 декабря 2016 года № 3251. Утратило силу решением Жамбылского районного маслихата Жамбылской области от 4 марта 2022 года № 16-2 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану по Жамбылскому району
  kaz: Жамбыл ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсалған шығындарын өндіріп алу мөлшерін және тәртібін айқындау  туралы
