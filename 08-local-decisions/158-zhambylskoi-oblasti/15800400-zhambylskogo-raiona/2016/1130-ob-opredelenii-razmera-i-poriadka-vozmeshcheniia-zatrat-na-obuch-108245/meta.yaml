  title:
    rus: О внесении изменений в решение Жамбылского районного маслихата от 30 ноября 2016 года № 6-8 «Об определении размера и порядка возмещения затрат на обучение на дому детей с ограниченными возможностями из числа инвалидов по индивидуальному учебному плану по Жамбылскому району»
    kaz: «Жамбыл ауданында мүгедектер қатарындағы кемтар балаларды жеке оқыту жоспары бойынша үйде оқытуға жұмсалған шығындарды өндіріп алу мөлшерін және тәртібін айқындау туралы» Жамбыл аудандық мәслихатының 2016 жылғы 30 қарашадағы № 6-8 шешіміне өзгерістер енгізу туралы
