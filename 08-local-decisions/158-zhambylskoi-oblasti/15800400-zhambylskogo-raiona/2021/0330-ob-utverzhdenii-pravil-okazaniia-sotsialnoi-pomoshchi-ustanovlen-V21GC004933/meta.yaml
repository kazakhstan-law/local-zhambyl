  title:
    rus: О внесении изменений в решение Жамбылского районного маслихата от 30 марта 2021 года №3-3 «Об утверждении Правил оказания социальной помощи, установления  размеров и определения перечня отдельных категорий нуждающихся граждан по Жамбылскому району»
    kaz: Жамбыл аудандық мәслихатының 2021 жылғы 30 наурыздағы №3-3 «Жамбыл ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» шешіміне өзгерістер енгізу туралы
