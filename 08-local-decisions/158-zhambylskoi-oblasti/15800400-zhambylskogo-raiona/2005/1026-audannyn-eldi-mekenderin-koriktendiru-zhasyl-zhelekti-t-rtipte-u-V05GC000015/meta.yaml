  title:
    rus: О признании утратившим силу решение маслихата Жамбылского района от 26 октября 2005 года № 18-2 «Об утверждении правил защиты зеленых насаждений, порядок содержания и благоустройства населенных пунктов района»
    kaz: «Ауданның елді мекендерін көріктендіру, жасыл желекті тәртіпте ұстау мен қорғаудың Ережесін бекіту туралы» Жамбыл аудандық мәслихатының 2005 жылғы 26 қазандағы № 18-2 шешімінің күшін жою туралы
