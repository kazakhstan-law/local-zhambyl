act_code: '43109'
requisite: Жамбыл облысы Жамбыл ауданы әкімінің 2008 жылғы 25 қарашадағы № 13 шешімі. Жамбыл облысы Жамбыл ауданының Әділет басқармасында 2008 жылғы 31 желтоқсанда 6-3-74 нөмірімен тіркелді. Қаулысының қабылдау мерзімінің өтуіне байланысты күші жойылды (Жамбыл ауданы әкімі аппаратының 2012 жылғы 8 маусымдағы № 3/904 хаты)
title:
  rus: 2009 жылы Жамбыл ауданының аумағында тұратын 1992 жылы туылған ер азаматтарды шақыру учаскесіне тіркеуді жүргізуді ұйымдастыру туралы
