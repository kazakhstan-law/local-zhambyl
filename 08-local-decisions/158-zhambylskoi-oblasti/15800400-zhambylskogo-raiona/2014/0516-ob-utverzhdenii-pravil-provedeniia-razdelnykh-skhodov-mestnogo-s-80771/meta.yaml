act_code: '80771'
requisite: Решение Жамбылского районного маслихата Жамбылской области от 16 мая 2014 года № 32-4. Зарегистрировано Департаментом юстиции Жамбылской области 19 июня 2014 года № 2244. Утратило силу решением Жамбылского районного маслихата Жамбылской области от 5 мая 2024 года № 20-3 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Жамбылском районе
  kaz: Жамбыл ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің Қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы
