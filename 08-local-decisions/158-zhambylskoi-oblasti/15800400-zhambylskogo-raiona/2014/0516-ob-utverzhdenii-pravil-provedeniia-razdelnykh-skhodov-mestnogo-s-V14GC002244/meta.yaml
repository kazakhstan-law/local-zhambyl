  title:
    rus: О признании утратившим силу решение Жамбылского районного маслихата от 16 мая 2014 года № 32-4 «Об утверждении Правил проведения раздельных сходов местного сообщества и количественного состава представителей жителей села, улицы, многоквартирного жилого дома для участия в сходе местного сообщества в Жамбылском районе»
    kaz: Жамбыл аудандық мәслихатының 2014 жылғы 16 мамырдағы №32-4 «Жамбыл ауданында бөлек жергілікті қоғамдастық жиындарын өткізудің қағидаларын және жергілікті қоғамдастық жиынына қатысу үшін ауыл, көше, көппәтерлі тұрғын үй тұрғындары өкілдерінің сандық құрамын бекіту туралы» шешімінің күші жойылды деп тану туралы
