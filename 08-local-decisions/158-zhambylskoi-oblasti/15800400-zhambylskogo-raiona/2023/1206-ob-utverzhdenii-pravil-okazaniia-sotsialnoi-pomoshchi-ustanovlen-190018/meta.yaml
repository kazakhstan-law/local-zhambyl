  title:
    rus: О внесении изменений и дополнений в решение Жамбылского районного от 6 декабря 2023 года № 11-3 «Об утверждении Правил оказания социальной помощи, установления ее размеров и определения перечня отдельных категорий нуждающихся граждан по Жамбылскому району»
    kaz: «Жамбыл ауданы бойынша әлеуметтік көмек көрсетудің, оның мөлшерлерін белгілеудің және мұқтаж азаматтардың жекелеген санаттарының тізбесін айқындаудың Қағидаларын бекіту туралы» Жамбыл аудандық мәслихатының 2023 жылғы 6 желтоқсандағы № 11-3 шешіміне өзгерістер мен толықтырулар енгізу туралы
