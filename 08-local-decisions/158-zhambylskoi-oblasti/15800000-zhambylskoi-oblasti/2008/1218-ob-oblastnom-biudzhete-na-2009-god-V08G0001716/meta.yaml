  requisite: Жамбыл облыстық мәслихатының 2009 жылғы 29 қазандағы № 16-5 шешімі. Жамбыл облыстық Әділет департаментінде 2009 жылғы 6 қарашадағы Нормативтік құқықтық кесімдерді мемлекеттік тіркеудің тізіліміне № 1729 болып енгізілді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Жамбыл облыстық Әділет департаментінің 2013 жылғы 11 наурыздағы № 2-2-17/388 хаты)
