act_code: '226319'
requisite: Решение маслихата Жамбылской области от 25 сентября 2025 года № 26-6
title:
  rus: О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Республики Казахстан постоянно проживающим в Жамбылской области при амбулаторном лечении бесплатно и (или) на льготных условиях
  kaz: Жамбыл облысында тұрақты тұратын Қазақстан Республикасы азаматтарының жекелеген санаттарына амбулаториялық емдеу кезінде тегін және (немесе) жеңілдікті шарттармен тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде дәрілік заттарды, арнайы емдік өнімдерді, медициналық бұйымдарды қосымша беру тізбесі туралы
