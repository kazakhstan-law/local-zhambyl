requisite: Решение Жамбылского областного маслихата от 6 апреля 2018 года № 22-8. Зарегистрировано Департаментом юстиции Жамбылской области 18 апреля 2018 года № 3794. Утратило силу решением Жамбылского областного маслихата от 21 апреля 2023 года № 2-10 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении методики оценки деятельности административных государственных служащих корпуса «Б» аппарата маслихата Жамбылской области и председателя ревизионной  комиссии по Жамбылской области
  kaz: Жамбыл облыстық мәслихаты аппаратының «Б» корпусы мемлекеттік әкімшілік қызметшілерінің және Жамбыл облысы бойынша тексеру комиссиясы төрағасының қызметін бағалаудың әдістемесін бекіту туралы
