act_code: '19110'
requisite: Жамбыл облыстық мәслихатының 2004 жылғы 30 қаңтардағы № 2-9 шешімі. Жамбыл облыстық Әділет Департаментінде 2004 жылғы 12 наурызда 1247 нөмерімен тіркелді. Шешімінің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Жамбыл облысы Әділет департаментінің 2007 жылғы 24 сәуірдегі № 4-1874 хатымен
title:
