act_code: '22106'
requisite: Жамбыл облысы әкімінің 2004 жылғы 10 қарашадағы № 30 шешімі. Жамбыл облыстық әділет Департаментінде 2004 жылы 29 қарашада № 1508 тіркелді. Шешімінің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Жамбыл облысы Әділет департаментінің 2007 жылғы 24 сәуірдегі № 4-1874 хатымен
