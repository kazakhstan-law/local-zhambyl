requisite: Жамбыл облыстық мәслихатының 27 тамыздағы № 5-4 шешімі. Жамбыл облыстық әділет департаментінде 2004 жылғы 28 қазанда № 1474 тіркелді. Шешімінің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Жамбыл облысы Әділет департаментінің 2007 жылғы 24 сәуірдегі № 4-1874 хатымен
