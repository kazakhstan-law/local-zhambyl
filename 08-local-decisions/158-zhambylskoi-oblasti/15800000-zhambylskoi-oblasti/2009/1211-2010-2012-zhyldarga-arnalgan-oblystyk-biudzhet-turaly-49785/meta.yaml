requisite: Жамбыл облыстық мәслихатының 2009 жылғы 11 желтоқсандағы № 19-3 шешімі. Жамбыл облысының Әділет департаментінде 2010 жылғы 10 қаңтарда 1737 нөмірімен тіркелді. Шешімнің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды (Жамбыл облыстық Әділет департаментінің 2013 жылғы 11 наурыздағы № 2-2-17/388 хаты)
