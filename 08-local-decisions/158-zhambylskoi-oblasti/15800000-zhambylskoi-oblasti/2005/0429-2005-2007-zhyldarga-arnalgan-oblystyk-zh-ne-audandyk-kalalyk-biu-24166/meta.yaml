requisite: Жамбыл облыстық мәслихатының 2005 жылғы 29 сәуірдегі № 8-9 шешімі. Жамбыл облыстық әділет Департаментінде 2005 жылғы 17 мамырда № 1615 тіркелді. Шешімінің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Жамбыл облысы Әділет департаментінің 2007 жылғы 24 сәуірдегі № 4-1874 хатымен
