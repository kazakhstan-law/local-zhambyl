    kaz: Мемлекеттік орман қоры аумағында  жеке тұлғалардың өз қажеттілігіне ақысыз, рұқсат беру құжаттарынсыз жабайы  жеміс, жаңғақ, аңырауқұлақ, дәрілік өсімдік шикізаттарын және орман ресурстарын жинау нормаларын бекіту туралы
