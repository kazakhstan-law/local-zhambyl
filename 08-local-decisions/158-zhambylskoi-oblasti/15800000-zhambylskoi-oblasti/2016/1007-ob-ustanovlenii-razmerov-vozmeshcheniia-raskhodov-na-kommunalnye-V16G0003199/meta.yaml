  title:
    rus: О признании утратившим силу решения Жамбылского областного маслихата от 7 октября 2016 года № 5-9 «Об установлении размеров возмещения расходов на коммунальные услуги и топливо за счет бюджетных средств медицинским и фармацевтическим работникам организаций государственного сектора здравоохранения, работающим в сельской местности и поселках городского типа»
    kaz: «Мемлекеттік денсаулық сақтау секторы ұйымдарының ауылдық жерде және қала үлгісіндегі кенттерде жұмыс істейтін медицина және фармацевтика қызметкерлеріне коммуналдық қызметтерге және отынға арналған шығыстарды бюджет қаражаты есебінен өтеу мөлшерін белгілеу туралы» Жамбыл облыстық мәслихатының 2016 жылғы 7 қазандағы № 5-9 шешімнің күші жойылды деп тану туралы
