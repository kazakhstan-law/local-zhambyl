requisite: Жамбыл облыстық мәслихатының 2006 жылғы 28 шілдедегі № 18-5 шешімі. Жамбыл облыстық әділет Департаментінде 2006 жылғы 1 қыркүйекте 1647 нөмірімен тіркелді. Шешімінің қабылдау мерзімінің өтуіне байланысты қолдану тоқтатылды - Жамбыл облысы Әділет департаментінің 2007 жылғы 24 сәуірдегі № 4-1874 хатымен
