act_code: '170256'
requisite: Решение Жамбылского областного маслихата от 29 июля 2022 года № 19-12. Зарегистрировано в Министерстве юстиции Республики Казахстан 1 августа 2022 года № 28970. Утратило силу решением Жамбылского областного маслихата от 19 марта 2025 года № 22-6 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: О дополнительном предоставлении гарантированного объема бесплатной медицинской помощи, в том числе лекарственных средств, специализированных лечебных продуктов, медицинских изделий, отдельным категориям граждан Республики Казахстан, постоянно проживающим в Жамбылской области при амбулаторном лечении бесплатно
  kaz: Жамбыл облысында тұрақты тұратын Қазақстан Республикасы азаматтарының жекелеген санаттарына, амбулаториялық емделу кезінде қосымша тегін медициналық көмектің кепілдік берілген көлемін, оның ішінде  дәрілік заттарды, мамандандырылған емдік өнімдер мен медициналық бұйымдарды беру туралы
