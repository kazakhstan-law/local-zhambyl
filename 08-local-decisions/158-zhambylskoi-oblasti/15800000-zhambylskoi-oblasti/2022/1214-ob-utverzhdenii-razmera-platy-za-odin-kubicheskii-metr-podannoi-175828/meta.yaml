requisite: Решение Жамбылского областного маслихата от 14 декабря 2022 года № 23-8. Зарегистрировано в Министерстве юстиции Республики Казахстан 22 декабря 2022 года № 31213. Утратило силу постановлением акимата Жамбылской области от 5 мая 2026 года № 33-8 (вводится в действие по истечении десяти календарных дней после дня его первого официального опубликования)
title:
  rus: Об утверждении размера платы за один кубический метр поданной питьевой воды населению из особо важных групповых и локальных систем водоснабжения, являющихся безальтернативными источниками питьевого водоснабжения по Жамбылской области
  kaz: Жамбыл облысы бойынша ауызсумен жабдықтаудың баламасыз көздері болып табылатын сумен жабдықтаудың ерекше маңызды топтық және оқшау жүйелерінен халыққа берілген ауызсудың бір текше метрі үшін төлемақы мөлшерін бекіту туралы
