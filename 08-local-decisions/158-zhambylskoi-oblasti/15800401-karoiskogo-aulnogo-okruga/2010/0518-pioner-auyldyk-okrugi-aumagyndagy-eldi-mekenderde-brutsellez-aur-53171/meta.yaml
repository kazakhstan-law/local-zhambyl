act_code: '53171'
requisite: Жамбыл облысы Жамбыл ауданы әкімдігінің 2010 жылғы 18 мамырдағы № 6 қаулысы. Жамбыл облысы Жамбыл ауданының Әділет басқармасында 2010 жылғы 16 маусымда 6-3-120 нөмірімен тіркелді. Күші жойылды - Жамбыл облысы Жамбыл ауданы Пионер ауылдық округінің 2010 жылғы 18 қазандағы № 15 шешімімен
title:
  rus: Пионер ауылдық округі аумағындағы елді-мекендерде бруцеллез ауруының тіркелуіне байланысты шектеу іс-шараларын енгізе отырып, ветеринариялық режим белгілеу туралы
  kaz: Пионер ауылдық округі аумағындағы елді-мекендерде бруцеллез ауруының тіркелуіне байланысты шектеу іс-шараларын енгізе отырып, ветеринариялық режим белгілеу туралы
